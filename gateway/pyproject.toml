[project]
name = "gateway"
version = "1.2.2"
description = "Tabularia control plane: auth, utenti/gruppi, progetti/permessi, proxy verso l'engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.1",
    "uvicorn>=0.49.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.9",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.32",
    "cryptography>=44.0.0",
    "croniter>=6.2.4",
    "pydantic-ai-slim[openai]>=2.40.0",
    "openlineage-python>=1.53.0",
    "sqlglot>=25.0.0",
    "alembic>=1.16",
    "packaging>=24.0",
    "ruff>=0.17.1",
    # the notebooks' proxy (routes/notebook_proxy.py): the client towards marimo's WebSocket,
    # and the server uvicorn uses for the browser's
    "websockets>=15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
