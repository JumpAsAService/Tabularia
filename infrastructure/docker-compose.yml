services:
  # Valkey: BSD-3 open source fork of Redis, drop-in (same protocol/port).
  # The service keeps the name "redis" so REDIS__HOST, the Celery broker and the
  # redis:// URLs do not change.
  redis:
    image: valkey/valkey:8-alpine
    container_name: dataprep-valkey
    restart: unless-stopped
    # no port on the host — broker and cache, used only by the containers
    volumes:
      - redis_data:/data
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Postgres: control plane metadata DB (users, groups, projects, permissions).
  # Owned ONLY by the gateway; the engine stays stateless (Valkey + MinIO).
  postgres:
    image: postgres:16-alpine
    container_name: dataprep-postgres
    # Restarts by itself like the app services. When the machine reboots, Docker restarts
    # ONLY the containers with a restart policy, and does so ignoring depends_on: with
    # backend and gateway «unless-stopped» and this one not, the gateway came back without
    # Postgres, gave up after a minute and stayed up but dead (uvicorn --reload does not
    # relaunch it) — the UI showed «NetworkError» until it was restarted by hand.
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"  # 5433 on the host: avoids clashing with a local Postgres, if any
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB__USER:-tabularia}
      - POSTGRES_PASSWORD=${DB__PASSWORD:-tabularia}
      - POSTGRES_DB=${DB__NAME:-tabularia}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB__USER:-tabularia}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO: real S3-compatible object storage (multipart streaming to disk,
  # handles large files without buffering them in RAM as rclone serve s3 did).
  # The root credentials come from the same variables the app uses (a single
  # source of truth in .env).
  # The official minio/minio image has been withdrawn from the registries: this is
  # the community-maintained fork (same code, same APIs), pinned to a release.
  # MINIO_IMAGE replaces it with the one you prefer.
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    container_name: dataprep-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9002:9000"  # S3 API (9002 on the host: 9000 is taken by ClickHouse)
      - "127.0.0.1:9001:9001"  # web console
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${STORAGE__ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${STORAGE__SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Engine (data plane): NOT exposed on the host. Reachable only from the other
  # services on the Docker network (the gateway proxies it). No `ports:`.
  # The `keys` volume belongs to the services (uid 10001) whatever mounts it first: a
  # volume Docker creates for an image without that directory, or for a container started
  # earlier, is root's, and the services could not create the encryption key in it.
  keys-init:
    image: alpine:3.20
    container_name: dataprep-keys-init
    command: ["sh", "-c", "chown -R 10001:10001 /keys && chmod 700 /keys && find /keys -type f -exec chmod 600 {} +"]
    volumes:
      - keys:/keys
    restart: "no"

  backend:
    # SINGLE backend image (see backend/Dockerfile): with chDB and pytest in
    # development, without them in production; same rules, non-root user
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        WITH_CHDB: "true"
        WITH_DEV: "true"
        # the SQL Server driver is Microsoft's, under Microsoft's licence: off, as in the
        # published images; WITH_MSSQL=true docker compose build turns it on
        WITH_MSSQL: ${WITH_MSSQL:-false}
    image: tabularia-backend:dev
    container_name: dataprep-backend
    # restarts by itself if the container dies (e.g. OOM-kill of the main process):
    # no engine down, no runs left hanging until the stale timeout
    restart: unless-stopped
    expose:
      - "8000"  # internal to the dataprep-network network only
    # .env is optional: with no file at all the stack starts, the Fernet key is created in the
    # `keys` volume and the first administrator is created at the sign-in page
    env_file:
      - path: .env
        required: false
    environment:
      - SECURITY__FERNET_KEY=${SECURITY__FERNET_KEY:-}
      # empty key: the one created at the first start in the shared `keys` volume
      - SECURITY__KEYS_DIR=/var/lib/tabularia/keys
      # the stack's own services, also with no .env (the code's defaults are for running outside Docker)
      - REDIS__HOST=${REDIS__HOST:-redis}
      - STORAGE__ENDPOINT=${STORAGE__ENDPOINT:-http://minio:9000}
      # the mounted sources belong to the host's user, not to the container's user
      # 10001: pytest does not try to write its cache into them
      - PYTEST_ADDOPTS=-p no:cacheprovider
    volumes:
      - ../backend:/app
      - keys:/var/lib/tabularia/keys
    depends_on:
      keys-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    # RAM ceiling: an operation that blows up (e.g. a cross join) is killed by the
    # container's OOM instead of freezing the host. memswap_limit == mem_limit
    # DISABLES the container's swap (swap-thrashing is what locks up the PC).
    mem_limit: ${BACKEND_MEM_LIMIT:-4g}
    memswap_limit: ${BACKEND_MEM_LIMIT:-4g}
    # --reload-dir: only the code. Without it the reloader polls every file under
    # /app four times a second, a local .venv included, and takes half a core.
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app

  # Gateway (control plane): the ONLY public entry point (:8000). Auth + RBAC +
  # Postgres, then forwards to the internal engine. Here ONE process does everything
  # (APP__ROLE=all, the default): it answers requests, fires the schedules and
  # executes the flows. In production the same two jobs can be split and
  # replicated (APP__ROLE=api / orchestrator): see infrastructure/.env.example.
  gateway:
    # SINGLE gateway image (see gateway/Dockerfile): with pytest in development,
    # without it in production; same rules, non-root user
    build:
      context: ../gateway
      dockerfile: Dockerfile
      args:
        WITH_DEV: "true"
    image: tabularia-gateway:dev
    container_name: dataprep-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    # .env is optional: with no file at all the stack starts, the Fernet key is created in the
    # `keys` volume and the first administrator is created at the sign-in page
    env_file:
      - path: .env
        required: false
    environment:
      - SECURITY__FERNET_KEY=${SECURITY__FERNET_KEY:-}
      # empty key: the one created at the first start in the shared `keys` volume
      - SECURITY__KEYS_DIR=/var/lib/tabularia/keys
      # the first administrator's password: no default, so that no installation
      # comes up with one everyone knows (the gateway also refuses 'admin' and
      # anything under 12 characters when it creates the administrator)
      # no password: while no account exists, the sign-in page creates the first administrator
      # (this stack answers on 127.0.0.1 only); a password set here creates it instead
      - AUTH__ADMIN_PASSWORD=${AUTH__ADMIN_PASSWORD:-}
      - AUTH__FIRST_RUN_SETUP=true
      - ENGINE__BASE_URL=http://backend:8000
      # The gateway keeps its OWN copy of the bucket name and compares it with the
      # one in every request, rejecting with 403 if they do not match. Deriving it
      # from the same variable as the backend is what keeps the two from diverging.
      - ENGINE__BUCKET=${STORAGE__BUCKET:-data-prep}
      - DB__HOST=postgres
      - DB__PORT=5432
      # development: the gateway applies the schema migrations itself at startup
      # (in production a separate step applies them: python -m app.db.migra)
      - DB__AUTO_MIGRATE=true
      # the mounted sources belong to the host's user, not to the container's user
      # 10001: pytest does not try to write its cache into them
      - PYTEST_ADDOPTS=-p no:cacheprovider
    volumes:
      - ../gateway:/app
      - keys:/var/lib/tabularia/keys
    depends_on:
      keys-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    # makes a wedged gateway VISIBLE: with `uvicorn --reload` a startup failure
    # (e.g. DB host not resolvable) leaves the container "running" but not serving.
    # The image is slim (no curl/wget) → the Python stdlib is used.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # --reload-dir: only the code (see the backend above)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app

  worker:
    # SINGLE backend image (see backend/Dockerfile): with chDB and pytest in
    # development, without them in production; same rules, non-root user
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        WITH_CHDB: "true"
        WITH_DEV: "true"
        WITH_MSSQL: ${WITH_MSSQL:-false}
    image: tabularia-backend:dev
    # NB: no container_name → so that `docker compose up -d --scale worker=N`
    # can start several replicas (a fixed name collides and blocks scaling).
    # restarts by itself after an OOM-kill of the worker's main process:
    # the edge case where the whole container dies rather than just the child task
    restart: unless-stopped
    # .env is optional: with no file at all the stack starts, the Fernet key is created in the
    # `keys` volume and the first administrator is created at the sign-in page
    env_file:
      - path: .env
        required: false
    environment:
      # glibc opens one malloc arena per thread: with the many Polars/Arrow threads
      # this inflates the leftover RSS (memory not returned to the OS). Capping the
      # arenas reduces fragmentation and flattens the steps in memory usage.
      - MALLOC_ARENA_MAX=2
      - SECURITY__FERNET_KEY=${SECURITY__FERNET_KEY:-}
      # empty key: the one created at the first start in the shared `keys` volume
      - SECURITY__KEYS_DIR=/var/lib/tabularia/keys
      # the stack's own services, also with no .env (the code's defaults are for running outside Docker)
      - REDIS__HOST=${REDIS__HOST:-redis}
      - STORAGE__ENDPOINT=${STORAGE__ENDPOINT:-http://minio:9000}
    volumes:
      - ../backend:/app
      - keys:/var/lib/tabularia/keys
    depends_on:
      keys-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    # RAM ceiling of the worker (where runs execute): a run that blows up (cross join,
    # huge aggregations) is OOM-killed instead of freezing the host.
    # memswap_limit == mem_limit disables swap (avoids swap-thrashing).
    mem_limit: ${WORKER_MEM_LIMIT:-6g}
    memswap_limit: ${WORKER_MEM_LIMIT:-6g}
    # PURE worker (no -B): the clock is the dedicated `beat` service below, so
    # this service scales to N replicas without duplicating the periodic tasks.
    # No --concurrency → it comes from the config (CELERY__WORKER_CONCURRENCY,
    # default 2), the single source of truth also used for the per-child memory
    # cap. -Q celery: consumes ONLY the default queue (the heavy runs); the
    # previews go to the `preview` queue, served by the preview-worker below.
    command: celery -A app.tasks.celery_app worker -E -Q celery --loglevel=info

  # Beat = the stack's ONLY clock: schedules the periodic tasks (step cache
  # eviction, storage-stats) and queues them; the workers are the ones that RUN
  # them. MUST stay at 1 replica — N beats queue the periodic tasks N times. It
  # runs no tasks, so it is light and does not touch the storage (only the broker).
  beat:
    # SINGLE backend image (see backend/Dockerfile): with chDB and pytest in
    # development, without them in production; same rules, non-root user
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        WITH_CHDB: "true"
        WITH_DEV: "true"
        WITH_MSSQL: ${WITH_MSSQL:-false}
    image: tabularia-backend:dev
    container_name: dataprep-beat
    restart: unless-stopped
    # .env is optional: with no file at all the stack starts, the Fernet key is created in the
    # `keys` volume and the first administrator is created at the sign-in page
    env_file:
      - path: .env
        required: false
    environment:
      - SECURITY__FERNET_KEY=${SECURITY__FERNET_KEY:-}
      # empty key: the one created at the first start in the shared `keys` volume
      - SECURITY__KEYS_DIR=/var/lib/tabularia/keys
      # the stack's own services, also with no .env (the code's defaults are for running outside Docker)
      - REDIS__HOST=${REDIS__HOST:-redis}
      - STORAGE__ENDPOINT=${STORAGE__ENDPOINT:-http://minio:9000}
    volumes:
      - ../backend:/app
      - keys:/var/lib/tabularia/keys
    depends_on:
      keys-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --schedule /tmp/celerybeat-schedule --loglevel=info

  # Worker DEDICATED to previews: `preview` queue, interactive. Separate from the
  # runs worker so a preview is not stuck behind a long run (and vice versa).
  # No beat here. Previews are lighter → higher concurrency is possible, but
  # with the same per-child memory cap derived from the container limit
  # (it scales automatically with mem_limit/concurrency).
  preview-worker:
    # SINGLE backend image (see backend/Dockerfile): with chDB and pytest in
    # development, without them in production; same rules, non-root user
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        WITH_CHDB: "true"
        WITH_DEV: "true"
        WITH_MSSQL: ${WITH_MSSQL:-false}
    image: tabularia-backend:dev
    # no container_name → scalable with --scale preview-worker=N
    restart: unless-stopped
    # .env is optional: with no file at all the stack starts, the Fernet key is created in the
    # `keys` volume and the first administrator is created at the sign-in page
    env_file:
      - path: .env
        required: false
    environment:
      - MALLOC_ARENA_MAX=2
      - CELERY__WORKER_CONCURRENCY=${PREVIEW_WORKER_CONCURRENCY:-4}
      - SECURITY__FERNET_KEY=${SECURITY__FERNET_KEY:-}
      # empty key: the one created at the first start in the shared `keys` volume
      - SECURITY__KEYS_DIR=/var/lib/tabularia/keys
      # the stack's own services, also with no .env (the code's defaults are for running outside Docker)
      - REDIS__HOST=${REDIS__HOST:-redis}
      - STORAGE__ENDPOINT=${STORAGE__ENDPOINT:-http://minio:9000}
    volumes:
      - ../backend:/app
      - keys:/var/lib/tabularia/keys
    depends_on:
      keys-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    mem_limit: ${PREVIEW_WORKER_MEM_LIMIT:-4g}
    memswap_limit: ${PREVIEW_WORKER_MEM_LIMIT:-4g}
    command: celery -A app.tasks.celery_app worker -E -Q preview --loglevel=info

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: dataprep-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # the browser calls the GATEWAY (the only public entry point), not the engine
      - NUXT_PUBLIC_API_BASE=http://localhost:8000
      - NUXT_PUBLIC_BUCKET=data-prep
      # Grafana as seen by the BROWSER (iframe of the Monitoring tab)
      - NUXT_PUBLIC_GRAFANA_URL=http://localhost:3001
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - gateway

  # ── Monitoring ─────────────────────────────────────────────────────────
  # VictoriaMetrics: a lightweight Prometheus-compatible TSDB; it is also the scraper.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.103.0
    container_name: dataprep-victoriametrics
    restart: unless-stopped
    # no port on the host — Grafana queries it inside the network
    volumes:
      - vm_data:/vmdata
      - ./monitoring/scrape.yml:/etc/vm/scrape.yml:ro
    command:
      - "-storageDataPath=/vmdata"
      - "-promscrape.config=/etc/vm/scrape.yml"
      - "-retentionPeriod=3"  # months

  # Grafana: dashboards. Admin credentials from environment variables (change them in prod).
  grafana:
    image: grafana/grafana:11.2.0
    container_name: dataprep-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"  # 3000 is already the frontend's
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # embedded in the app's Monitoring tab (iframe): without allow_embedding
      # Grafana sends X-Frame-Options: deny. The anonymous Viewer is needed because
      # the iframe does not share the app's session: whoever reaches :3001 sees
      # the dashboards WITHOUT signing in (read-only). Fine locally; if you expose
      # the stack, close the port or put an auth proxy in front of it.
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_HIDE_VERSION=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - victoriametrics

  # cAdvisor: per-container metrics (CPU/mem/disk/network).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: dataprep-cadvisor
    restart: unless-stopped
    # no port on the host — VictoriaMetrics scrapes it
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    devices:
      - /dev/kmsg

  # node-exporter: host metrics (CPU, memory, disk/SSD, load).
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: dataprep-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro
    # no port on the host — VictoriaMetrics scrapes it

  # celery-exporter: active tasks, durations, outcomes, queue depth (via Celery events).
  celery-exporter:
    image: danihodovic/celery-exporter:latest
    container_name: dataprep-celery-exporter
    restart: unless-stopped
    environment:
      - CE_BROKER_URL=redis://redis:6379/0
    # no port on the host — VictoriaMetrics scrapes it
    depends_on:
      - redis

  # ── Sample data (on in this try-it stack) ──────────────────────────────────
  # Two fake external databases — an ERP on Postgres and a CRM on ClickHouse — and an
  # init container that fills them at the requested scale (SAMPLES_SCALE) and builds
  # the «Sample» folder in Tabularia: connections, tables, flows, schedules and views.
  # With no administrator yet it waits for the one created at the sign-in page. It runs
  # once and exits; running it again duplicates nothing. Not wanted:
  #   docker compose up -d --scale sampledb-init=0 --scale sampledb-postgres=0 --scale sampledb-clickhouse=0
  sampledb-postgres:
    image: postgres:16-alpine
    container_name: sampledb-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=shop
      - POSTGRES_PASSWORD=shop
      - POSTGRES_DB=shop
    ports:
      - "127.0.0.1:5434:5432"  # from the host only, just for poking around
    volumes:
      - sampledb_pg:/var/lib/postgresql/data
    command:
      - postgres
      - "-c"
      - "max_wal_size=8GB"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=256MB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "synchronous_commit=off"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 10s
      timeout: 5s
      retries: 5

  sampledb-clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: sampledb-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_USER=analytics
      - CLICKHOUSE_PASSWORD=analytics
      - CLICKHOUSE_DB=analytics
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - "127.0.0.1:8124:8123"
    volumes:
      - sampledb_ch:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sampledb-init:
    build: ./sampledb
    container_name: sampledb-init
    entrypoint: ["python", "seed_tabularia.py"]
    environment:
      - SAMPLES_SCALE=${SAMPLES_SCALE:-small}
      - SAMPLES_ENGINE=${SAMPLES_ENGINE:-}
      - SAMPLES_RUN_FLOWS=${SAMPLES_RUN_FLOWS:-true}
      - GATEWAY_URL=http://gateway:8000
      - AUTH__ADMIN_EMAIL=${AUTH__ADMIN_EMAIL:-}
      - AUTH__ADMIN_PASSWORD=${AUTH__ADMIN_PASSWORD:-}
      - PG_HOST=sampledb-postgres
      - PG_PORT=5432
      - PG_DB=shop
      - PG_USER=shop
      - PG_PASSWORD=shop
      - CH_HOST=sampledb-clickhouse
      - CH_PORT=8123
      - CH_DB=analytics
      - CH_USER=analytics
      - CH_PASSWORD=analytics
    depends_on:
      sampledb-postgres:
        condition: service_healthy
      sampledb-clickhouse:
        condition: service_healthy
      gateway:
        condition: service_healthy
    # with no administrator password, the start-up token the gateway leaves there
    volumes:
      - keys:/var/lib/tabularia/keys:ro
    restart: "no"

volumes:
  # the secrets created at the first start (fernet.key, bootstrap.token): back it up with the data
  keys:
  redis_data:
  minio_data:
  postgres_data:
  vm_data:
  grafana_data:
  sampledb_pg:
  sampledb_ch:

networks:
  default:
    name: dataprep-network