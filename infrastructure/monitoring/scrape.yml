# Targets VictoriaMetrics collects metrics from (Prometheus format).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]

  - job_name: backend           # FastAPI: requests/latency + custom cache metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: celery            # Celery tasks: active, durations, outcomes, queue
    static_configs:
      - targets: ["celery-exporter:9808"]

  - job_name: cadvisor          # per container: CPU/mem/disk/network
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # cAdvisor re-emits ALL the image's OCI labels as container_label_*
      # (~20: build_date, vcs_ref, vendor, version…). They are noise, and two have
      # a high cardinality that CHANGES at every rebuild — com_docker_compose_config_hash
      # and com_docker_compose_image=sha256:… — so every `docker compose build`
      # creates new timeseries and bloats the TSDB. They also break VM's cap of 30
      # labels per timeseries, which dropped precisely the useful labels (name, image).
      # They are dropped at scrape time: id/image/name/job/instance remain.
      - regex: 'container_label_.*'
        action: labeldrop

  - job_name: node              # host: CPU, memoria, disco/SSD, load
    static_configs:
      - targets: ["node-exporter:9100"]
