{{/*
Control plane — the only public entry point for the API — as TWO workloads built
from the same image. The gateway has two jobs, and each scales on its own:

  gateway        answers requests (APP__ROLE=api). Stateless: sessions are a
                 signed token, and the sign-in throttle and the editor's "also
                 open by" notice live in Postgres. One Python process uses one
                 core, so this is the one to replicate when people wait.

  orchestrator   does the background work (APP__ROLE=orchestrator): fires the
                 schedules, executes the flows, reconciles runs, cleans up. It
                 has no Service: nothing calls it. Several can run; they share
                 the work through the database — a schedule slot and a flow
                 execution are each taken by exactly one, and a flow never has
                 two executions running.

Both roll: a new pod starts before an old one stops. For the orchestrator that
means the executions the old pod was carrying are closed as interrupted when it
stops (they are not resumed) — see README → Upgrades.
*/}}
{{- define "tabularia.gateway.deployment" -}}
{{- $ := .root -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tabularia.fullname" $ }}-{{ .component }}
  labels:
    {{- include "tabularia.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .component }}
spec:
  {{- if not .autoscaled }}
  replicas: {{ .cfg.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tabularia.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ .component }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- if and $.Values.oidc.enabled $.Values.oidc.caCert }}
        checksum/oidc-ca: {{ $.Values.oidc.caCert | sha256sum }}
        {{- end }}
        {{- include "tabularia.secretChecksum" $ | nindent 8 }}
        {{- with .cfg.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tabularia.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ .component }}
    spec:
      {{- include "tabularia.imagePullSecrets" $ | nindent 6 }}
      {{- if or $.Values.adminScaling.enabled $.Values.scripts.enabled $.Values.containers.enabled $.Values.clusterView.enabled $.Values.settingsRollout.enabled }}
      # Admin → Workers changes the workers' autoscaling bounds (scaling-rbac.yaml);
      # Admin → Scripting environments runs Jobs in the scripts namespaces (scripts.yaml)
      # (the orchestrator has an account of its own: only it creates the image builds)
      serviceAccountName: {{ include "tabularia.fullname" $ }}-{{ ternary "orchestrator" "scaler" (eq .component "orchestrator") }}
      automountServiceAccountToken: true
      {{- else }}
      serviceAccountName: {{ include "tabularia.serviceAccountName" $ }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.automountToken }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .cfg.terminationGracePeriodSeconds | default 60 }}
      {{- if $.Values.migrations.enabled }}
      initContainers:
        # The database schema, before the application starts: the Alembic
        # migrations (gateway/app/db/migra.py). The first pod of a new version
        # does the work, the others find it done — a Postgres advisory lock
        # queues them. The application itself never migrates (DB__AUTO_MIGRATE
        # stays false): it only checks the database is not behind its code.
        # Migrations are written to work with the previous version still
        # running (expand/contract), so a rolling update is safe.
        - name: migrate
          image: {{ include "tabularia.image" (dict "root" $ "component" "gateway") }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          command: ["python", "-m", "app.db.migra"]
          envFrom:
            {{- include "tabularia.envFrom" $ | nindent 12 }}
          env:
            {{- include "tabularia.withoutEngineSecrets" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: {{ .component }}
          image: {{ include "tabularia.image" (dict "root" $ "component" "gateway") }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          # The client's address: ingress controllers add it to X-Forwarded-For,
          # and uvicorn reads the chain from the right, past the proxies it
          # trusts. Without this every request seems to come from the
          # controller, and the sign-in throttle, keyed by (address, email),
          # becomes per email: five wrong passwords lock anyone out, the
          # administrator included. Keep-alive above the controller's (60 s),
          # or a request can land on a connection the gateway just closed: 502.
          command:
            - uvicorn
            - app.main:app
            - --host=0.0.0.0
            - --port=8000
            - --proxy-headers
            - --forwarded-allow-ips={{ $.Values.gateway.trustedProxies }}
            - --timeout-keep-alive=75
            # stopping: the requests in flight finish, within the grace period
            - --timeout-graceful-shutdown={{ max 5 (sub (.cfg.terminationGracePeriodSeconds | default 60) 15) }}
          # Stopping, the pod first waits for the Service to drop it: closing its socket
          # at once refused the requests still sent to it (a 500 from the gateway's proxy,
          # a 502 from the ingress) at every upgrade, restart or scale-in.
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          ports:
            - name: http
              containerPort: 8000
          env:
            # What this process does. Set here and not in the shared ConfigMap:
            # it is the one setting that differs between the two workloads.
            - name: APP__ROLE
              value: {{ .role | quote }}
            - name: APP__GATEWAY_THREADS
              value: {{ $.Values.gateway.threads | quote }}
            {{- if $.Values.adminScaling.enabled }}
            {{- include "tabularia.scalingEnv" $ | nindent 12 }}
            {{- end }}
            {{- if $.Values.containers.enabled }}
            {{- include "tabularia.containersEnv" $ | nindent 12 }}
            {{- end }}
            {{- if $.Values.scripts.enabled }}
            {{- include "tabularia.scriptsEnv" $ | nindent 12 }}
            {{- end }}
            {{- if $.Values.clusterView.enabled }}
            - name: KUBERNETES__CLUSTER_VIEW
              value: "true"
            {{- end }}
            # which pods are the release's (Administration → Settings names them, and restarts
            # them with settingsRollout: scaling-rbac.yaml), and where
            - name: KUBERNETES__RELEASE
              value: {{ $.Release.Name | quote }}
            - name: KUBERNETES__APP_NAME
              value: {{ include "tabularia.name" $ | quote }}
            - name: KUBERNETES__NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            {{- if $.Values.settingsRollout.enabled }}
            - name: KUBERNETES__ROLLOUT
              value: "true"
            {{- end }}
            {{- include "tabularia.withoutEngineSecrets" $ | nindent 12 }}
          envFrom:
            {{- include "tabularia.envFrom" $ | nindent 12 }}
          # The schema is migrated by the init container above; the application
          # starts once it is done. Room before probing for a cold start.
          # /health answers on the event loop, apart from the threads that serve the
          # requests: a busy gateway is not a dead one. 5 s, not the default 1 s.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .cfg.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if include "tabularia.oidcCa" $ }}
            - name: oidc-ca
              mountPath: /etc/tabularia/oidc-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .cfg.tmpSizeLimit }}
        {{- with include "tabularia.oidcCa" $ }}
        {{- $ca := splitList "|" . }}
        - name: oidc-ca
          configMap:
            name: {{ index $ca 0 }}
            items: [{ key: {{ index $ca 1 | quote }}, path: ca.crt }]
        {{- end }}
      {{- with .cfg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .cfg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .cfg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{ include "tabularia.gateway.deployment" (dict "root" $ "component" "gateway" "role" "api" "cfg" .Values.gateway "autoscaled" .Values.gateway.autoscaling.enabled) }}
---
{{ include "tabularia.gateway.deployment" (dict "root" $ "component" "orchestrator" "role" "orchestrator" "cfg" .Values.gateway.orchestrator "autoscaled" false) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tabularia.fullname" . }}-gateway
  labels:
    {{- include "tabularia.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.gatewayPort }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "tabularia.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
