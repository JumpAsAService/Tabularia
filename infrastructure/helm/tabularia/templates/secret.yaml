{{/*
Created only when you do not bring your own Secret.

In production prefer `existingSecret`: values files tend to end up in git, and
these are the keys that protect stored database credentials and every session.

Note for least-privilege reviews: every pod mounts this one Secret, so the engine
pods also receive gateway-only values (JWT, database password). Splitting it per
component is possible — mount a narrower Secret in each deployment — at the cost
of a chart that is harder to follow. For a first rollout the single Secret is the
honest default; tighten it once the deployment is stable.
*/}}
{{- if not .Values.existingSecret }}
{{- if not .Values.secrets.fernetKey }}
{{- fail "secrets.fernetKey is required: every process refuses to start without it. Generate one with: python -c \"from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())\"" }}
{{- end }}
{{- if not .Values.secrets.jwtSecret }}
{{- fail "secrets.jwtSecret is required: it signs session tokens. Generate one with: openssl rand -hex 32" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tabularia.secretName" . }}
  labels:
    {{- include "tabularia.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Encrypts database connection credentials. The SAME value must reach the
  # gateway and every backend role, and it must not change after the first
  # connection is saved.
  SECURITY__FERNET_KEY: {{ .Values.secrets.fernetKey | quote }}
  JWT__SECRET: {{ .Values.secrets.jwtSecret | quote }}
  DB__PASSWORD: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  STORAGE__ACCESS_KEY: {{ required "secrets.storageAccessKey is required" .Values.secrets.storageAccessKey | quote }}
  STORAGE__SECRET_KEY: {{ required "secrets.storageSecretKey is required" .Values.secrets.storageSecretKey | quote }}
{{- with .Values.secrets.redisPassword }}
  # Optional: an unauthenticated in-cluster Redis needs none, a managed one does.
  REDIS__PASSWORD: {{ . | quote }}
{{- end }}
  # Seeded on first start only; an existing admin is never modified.
  AUTH__ADMIN_PASSWORD: {{ required "secrets.adminPassword is required" .Values.secrets.adminPassword | quote }}
{{- if .Values.oidc.enabled }}
  OIDC__CLIENT_SECRET: {{ required "secrets.oidcClientSecret is required when oidc.enabled" .Values.secrets.oidcClientSecret | quote }}
{{- end }}
{{- if .Values.externalServices.clickhouse.enabled }}
  CLICKHOUSE_EXTERNAL__PASSWORD: {{ required "secrets.clickhousePassword is required when clickhouse.enabled" .Values.secrets.clickhousePassword | quote }}
{{- end }}
{{- end }}
