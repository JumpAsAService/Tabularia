{{/*
Optional autoscalers, off by default.

A warning before you enable them: CPU is a poor signal for these workers. A pod
waiting on a slow database, or streaming a large parquet, uses little CPU while
being entirely busy — and a pod that finished its task uses none while still
holding a long shutdown grace period. Scaling on CPU therefore reacts late and
scales in at the wrong moment.

The signal that actually matches the work is QUEUE LENGTH: the Redis lists
`celery` (runs) and `preview` (previews). With KEDA installed in the cluster, set
worker/previewWorker.autoscaling.keda.enabled and templates/keda.yaml scales them
on the queue instead of the CPU.

Note also that scaling IN can interrupt a run: workers get a long termination
grace period precisely so a task finishes, so set a generous
`stabilizationWindowSeconds` or let the queue drain instead.

The gateway is the exception: it is busy exactly when it burns CPU (one Python
process, one core), so CPU utilisation is the right signal for it.

There is no autoscaler for the orchestrator (one or two are plenty, and scaling
one in interrupts the flows it is executing) nor for beat (a singleton).
*/}}
{{- range $name, $cfg := dict "engine" $.Values.engineApi "worker" $.Values.worker "preview-worker" $.Values.previewWorker "frontend" $.Values.frontend "gateway" $.Values.gateway }}
{{- if and $cfg.autoscaling.enabled (not (dig "keda" "enabled" false $cfg.autoscaling)) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "tabularia.fullname" $ }}-{{ $name }}
  labels:
    {{- include "tabularia.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "tabularia.fullname" $ }}-{{ $name }}
  {{- $hpa := dict "root" $ "apiVersion" "autoscaling/v2" "kind" "HorizontalPodAutoscaler" "name" (printf "%s-%s" (include "tabularia.fullname" $) $name) }}
  minReplicas: {{ include "tabularia.panelBound" (merge (dict "field" "minReplicas" "value" $cfg.autoscaling.minReplicas) $hpa) }}
  maxReplicas: {{ include "tabularia.panelBound" (merge (dict "field" "maxReplicas" "value" $cfg.autoscaling.maxReplicas) $hpa) }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
