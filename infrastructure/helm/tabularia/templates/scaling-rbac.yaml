{{- if .Values.adminScaling.enabled }}
{{/*
Admin → Workers on Kubernetes (adminScaling.enabled): the gateway and the
orchestrator run with this service account, which may read the two worker
Deployments and change the bounds of their autoscalers (HPA or KEDA ScaledObject),
named one by one, and nothing else. The panel sets the bounds, the orchestrator
keeps them applied (gateway services/kube_scaling.py). Every other pod keeps the
chart's account, without a token.
*/}}
{{- $full := include "tabularia.fullname" . }}
{{- $names := list (printf "%s-worker" $full) (printf "%s-preview-worker" $full) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-scaler
  labels:
    {{- include "tabularia.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-scaler
  labels:
    {{- include "tabularia.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: {{ toJson $names }}
    verbs: ["get"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    resourceNames: {{ toJson $names }}
    verbs: ["get", "patch"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    resourceNames: {{ toJson $names }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-scaler
  labels:
    {{- include "tabularia.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $full }}-scaler
subjects:
  - kind: ServiceAccount
    name: {{ $full }}-scaler
    namespace: {{ .Release.Namespace }}
{{- end }}
