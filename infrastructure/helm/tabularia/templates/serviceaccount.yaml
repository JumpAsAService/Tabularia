{{- if .Values.serviceAccount.create }}
{{/*
One service account for every component. Annotate it (values:
serviceAccount.annotations) when your object storage uses workload identity
instead of static access keys — then you can drop the storage keys from the
Secret entirely.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tabularia.serviceAccountName" . }}
  labels:
    {{- include "tabularia.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
