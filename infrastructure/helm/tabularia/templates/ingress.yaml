{{- if .Values.ingress.enabled }}
{{/*
One hostname serves both the UI and the API: the browser calls the gateway at
the same origin, which keeps cookies and CORS simple. The gateway sits under one
prefix (ingress.apiPrefix, /api), everything else goes to the frontend. The
prefix is NOT stripped: the gateway knows it (APP__ROOT_PATH) and answers under
it, so no controller-specific rewrite is needed. Routing the gateway's own paths
instead (/flows, /runs, /auth…) cannot work: they are also pages of the
frontend, and reloading one would show the API's JSON.

Three settings matter more than the rest, and the defaults of most controllers
get them wrong for this application:

  proxy-body-size        uploads stream through the gateway; the usual 1 MB
                         default rejects every real file
  proxy-request-buffering  must be off, or the proxy spools uploads to its disk
  proxy-read-timeout     previews are synchronous and wait for the engine

If you use a controller other than nginx, translate the annotations in values.

The notebooks' apps and editors have a host of their own (scripts.notebooks.host,
docs/capabilities/notebooks.md «An address of their own»): a second rule sends it,
under the same prefix, to the gateway alone, which answers there only for them. With
TLS on the Ingress it gets a certificate too, from scripts.notebooks.tlsSecretName
(cert-manager makes it from the annotations) unless a tls entry lists it already.
*/}}
{{- $nbHost := include "tabularia.notebooksHost" . }}
{{- if $nbHost }}
{{- range .Values.ingress.hosts }}
{{- if eq (.host | lower) $nbHost }}
{{- fail (printf "scripts.notebooks.host (%s) must be a host of its own, not the interface's (ingress.hosts): a notebook's code would act in Tabularia as whoever opens it" $nbHost) }}
{{- end }}
{{- end }}
{{- end }}
{{- $tls := .Values.ingress.tls | default list }}
{{- if and $tls $nbHost }}
{{- $covered := false }}
{{- range $tls }}
{{- if has $nbHost (.hosts | default list) }}{{ $covered = true }}{{ end }}
{{- end }}
{{- if not $covered }}
{{- $secret := .Values.scripts.notebooks.tlsSecretName | default (printf "%s-notebooks-tls" (include "tabularia.fullname" .)) }}
{{- $tls = append $tls (dict "hosts" (list $nbHost) "secretName" $secret) }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tabularia.fullname" . }}
  labels:
    {{- include "tabularia.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- /* the API first: longest-prefix routing sends it to the gateway */}}
          - path: {{ required "ingress.apiPrefix is required, e.g. /api" $.Values.ingress.apiPrefix }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "tabularia.fullname" $ }}-gateway
                port:
                  number: {{ $.Values.service.gatewayPort }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "tabularia.fullname" $ }}-{{ .service }}
                port:
                  number: {{ if eq .service "gateway" }}{{ $.Values.service.gatewayPort }}{{ else }}{{ $.Values.service.frontendPort }}{{ end }}
          {{- end }}
    {{- end }}
    {{- if $nbHost }}
    # the notebooks' own host: the gateway alone, under the same prefix
    - host: {{ $nbHost | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.apiPrefix }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "tabularia.fullname" . }}-gateway
                port:
                  number: {{ .Values.service.gatewayPort }}
    {{- end }}
{{- end }}
