{{/*
Non-secret configuration, mirroring the .env surface the application already
uses in docker-compose. Keeping the same variable names means anything you learn
from the compose setup transfers directly.
*/}}
{{- define "tabularia.configData" -}}
APP__ENV_NAME: {{ include "tabularia.env" (.Values.app.envName) }}
APP__TIMEZONE: {{ include "tabularia.env" (.Values.app.timezone) }}
# Audit log retention in minutes; 0 = kept forever
AUDIT__RETENTION_MINUTES: {{ include "tabularia.env" (.Values.app.auditRetentionMinutes) }}
PREVIEW__DEFAULT_SAMPLE_ROWS: {{ include "tabularia.env" (.Values.app.previewDefaultSampleRows | default 0) }}

# Broker and step-cache index
REDIS__HOST: {{ required "externalServices.redis.host is required" .Values.externalServices.redis.host | quote }}
REDIS__PORT: {{ include "tabularia.env" (.Values.externalServices.redis.port) }}
REDIS__DB: {{ include "tabularia.env" (.Values.externalServices.redis.db) }}

# Object storage — the durable side of the system
STORAGE__ENDPOINT: {{ required "externalServices.storage.endpoint is required" .Values.externalServices.storage.endpoint | quote }}
STORAGE__BUCKET: {{ include "tabularia.env" (.Values.externalServices.storage.bucket) }}
STORAGE__REGION: {{ include "tabularia.env" (.Values.externalServices.storage.region) }}
# The gateway keeps its OWN copy of the bucket name and compares it against the
# bucket in every request, rejecting a mismatch with 403. Rendering it from the
# same value is what stops the two from drifting apart.
ENGINE__BUCKET: {{ include "tabularia.env" (.Values.externalServices.storage.bucket) }}

# Metadata database (gateway only, but harmless elsewhere)
DB__HOST: {{ required "externalServices.postgres.host is required" .Values.externalServices.postgres.host | quote }}
DB__PORT: {{ include "tabularia.env" (.Values.externalServices.postgres.port) }}
DB__NAME: {{ include "tabularia.env" (.Values.externalServices.postgres.database) }}
DB__USER: {{ include "tabularia.env" (.Values.externalServices.postgres.user) }}

# A JSON list (pydantic parses it as JSON). Empty, the default: the UI and the
# API share one host and no other origin may call it with credentials. Left
# unset, the application would fall back to its development origins.
APP__CORS_ORIGINS: {{ toJson (.Values.app.corsOrigins | default list) | quote }}
# The prefix the gateway is published under (see templates/ingress.yaml): the
# gateway needs it for the paths it writes for the browser — the SSO cookie,
# /docs, redirects.
APP__ROOT_PATH: {{ .Values.ingress.apiPrefix | quote }}
# Powers the RAM badge. Empty, the badge is off: rendered anyway, or the
# application would fall back to the docker-compose address and fail every poll.
MONITORING__NODE_EXPORTER_URL: {{ .Values.monitoring.nodeExporterUrl | default "" | quote }}

JWT__ACCESS_TTL_MINUTES: {{ include "tabularia.env" (.Values.auth.jwtAccessTtlMinutes) }}
AUTH__SESSION_IDLE_MINUTES: {{ include "tabularia.env" (.Values.auth.sessionIdleMinutes) }}
AUTH__COOKIE_DOMAIN: {{ .Values.auth.cookieDomain | default "" | quote }}
AUTH__PERSONAL_TOKENS: {{ .Values.auth.personalTokens | quote }}
AUTH__API_TOKEN_MAX_DAYS: {{ include "tabularia.env" (.Values.auth.apiTokenMaxDays) }}
WEBHOOKS__RETENTION_DAYS: {{ include "tabularia.env" (.Values.webhooks.retentionDays) }}
WEBHOOKS__TIMEOUT_SECONDS: {{ include "tabularia.env" (.Values.webhooks.timeoutSeconds) }}
AUTH__ADMIN_EMAIL: {{ include "tabularia.env" (.Values.auth.adminEmail) }}
AUTH__ADMIN_NAME: {{ include "tabularia.env" (.Values.auth.adminName) }}

# Engine API, reached only from inside the cluster
ENGINE__BASE_URL: "http://{{ include "tabularia.fullname" . }}-engine:{{ .Values.service.gatewayPort }}"
# Read by the engine API: how long it waits for a preview worker before
# revoking the job and answering 504.
PREVIEW_TIMEOUT_SECONDS: {{ include "tabularia.env" (.Values.engine.previewTimeoutSeconds) }}
# How long a run may take. The worker kills the task at the hard limit, and the
# gateway declares a run lost only after that — which is why the stale timeout
# must stay above it. Every workload reads this same ConfigMap, so the two
# halves of that agreement cannot drift apart between engine and gateway.
CELERY__TASK_TIME_LIMIT: {{ include "tabularia.env" (.Values.engine.taskTimeLimitSeconds) }}
CELERY__TASK_SOFT_TIME_LIMIT: {{ include "tabularia.env" (.Values.engine.taskSoftTimeLimitSeconds) }}
ENGINE__RUN_STALE_TIMEOUT_SECONDS: {{ include "tabularia.env" (.Values.engine.runStaleTimeoutSeconds) }}
# Administration → Settings may override some of the values in this ConfigMap at
# runtime (docs/engine-settings.md); false keeps this ConfigMap the only source
ENGINE__SETTINGS_PANEL: {{ .Values.engine.settingsPanel | quote }}

CACHE__TTL_SECONDS: {{ include "tabularia.env" (.Values.cache.ttlSeconds) }}
CACHE__SWEEP_INTERVAL_SECONDS: {{ include "tabularia.env" (.Values.cache.sweepIntervalSeconds) }}

ORCHESTRATOR__REFRESH_WAIT_SECONDS: {{ include "tabularia.env" (.Values.orchestrator.refreshWaitSeconds) }}
ORCHESTRATOR__POLL_INTERVAL_SECONDS: {{ include "tabularia.env" (.Values.orchestrator.pollIntervalSeconds) }}
ORCHESTRATOR__LOG_RETENTION_DAYS: {{ include "tabularia.env" (.Values.orchestrator.logRetentionDays) }}
ORCHESTRATOR__CONTRACT_RESULTS_KEPT: {{ include "tabularia.env" (.Values.orchestrator.contractResultsKept) }}
ORCHESTRATOR__VERSIONS_KEPT: {{ include "tabularia.env" (.Values.orchestrator.versionsKept) }}
ORCHESTRATOR__AI_CHAT_RETENTION_DAYS: {{ include "tabularia.env" (.Values.orchestrator.aiChatRetentionDays) }}
ORCHESTRATOR__MAX_CONCURRENT: {{ include "tabularia.env" (.Values.orchestrator.maxConcurrent) }}
ORCHESTRATOR__DEAD_AFTER_SECONDS: {{ include "tabularia.env" (.Values.orchestrator.deadAfterSeconds) }}
ORCHESTRATOR__QUEUE_TIMEOUT_SECONDS: {{ include "tabularia.env" (.Values.orchestrator.queueTimeoutSeconds) }}

# The database's backups (the orchestrator makes them, the engine stores them)
BACKUP__ENABLED: {{ include "tabularia.env" (.Values.backup.enabled) }}
BACKUP__SCHEDULE: {{ .Values.backup.schedule | quote }}
BACKUP__KEEP: {{ include "tabularia.env" (.Values.backup.keep) }}
BACKUP__BUCKET: {{ .Values.backup.bucket | quote }}
BACKUP__PREFIX: {{ .Values.backup.prefix | quote }}
BACKUP__ENDPOINT: {{ .Values.backup.endpoint | quote }}
BACKUP__REGION: {{ .Values.backup.region | quote }}
BACKUP__TIMEOUT_SECONDS: {{ include "tabularia.env" (.Values.backup.timeoutSeconds) }}
OPENLINEAGE__URL: {{ include "tabularia.env" (.Values.openlineage.url) }}
OPENLINEAGE__NAMESPACE: {{ include "tabularia.env" (.Values.openlineage.namespace) }}
OPENLINEAGE__FILE: {{ include "tabularia.env" (.Values.openlineage.file) }}
OPENLINEAGE__ENDPOINT: {{ include "tabularia.env" (.Values.openlineage.endpoint) }}
OPENLINEAGE__TIMEOUT_SECONDS: {{ include "tabularia.env" (.Values.openlineage.timeoutSeconds) }}

{{- if .Values.oidc.enabled }}
# Single sign-on. Setting OIDC__ISSUER is what switches SSO on; local login
# stays available as a break-glass path.
OIDC__ISSUER: {{ required "oidc.issuer is required when oidc.enabled" .Values.oidc.issuer | quote }}
OIDC__CLIENT_ID: {{ required "oidc.clientId is required when oidc.enabled" .Values.oidc.clientId | quote }}
OIDC__REDIRECT_URI: {{ required "oidc.redirectUri is required when oidc.enabled" .Values.oidc.redirectUri | quote }}
OIDC__SCOPES: {{ include "tabularia.env" (.Values.oidc.scopes) }}
OIDC__GROUPS_CLAIM: {{ include "tabularia.env" (.Values.oidc.groupsClaim) }}
OIDC__GROUP_ALLOWLIST: {{ include "tabularia.env" (.Values.oidc.groupAllowlist) }}
# Who may sign in (empty / false = no filter, the historical behaviour)
OIDC__ALLOWED_EMAIL_DOMAINS: {{ include "tabularia.env" (.Values.oidc.allowedEmailDomains) }}
OIDC__REQUIRE_ALLOWLISTED_GROUP: {{ include "tabularia.env" (.Values.oidc.requireAllowlistedGroup) }}
OIDC__AUTO_CREATE_GROUPS: {{ include "tabularia.env" (.Values.oidc.autoCreateGroups) }}
OIDC__AUTHORITATIVE: {{ include "tabularia.env" (.Values.oidc.authoritative) }}
OIDC__SUPERUSER_GROUP: {{ include "tabularia.env" (.Values.oidc.superuserGroup) }}
OIDC__POST_LOGIN_URL: {{ include "tabularia.env" (.Values.oidc.postLoginUrl) }}
OIDC__BUTTON_LABEL: {{ include "tabularia.env" (.Values.oidc.buttonLabel) }}
OIDC__VERIFY_TLS: {{ include "tabularia.env" (.Values.oidc.verifyTls) }}
{{- if include "tabularia.oidcCa" . }}
# the company's certificate authority, mounted by templates/gateway.yaml
OIDC__CA_FILE: "/etc/tabularia/oidc-ca/ca.crt"
{{- end }}
{{- end }}

# Administration → Container registries (containers.enabled)
CONTAINERS__ENABLED: {{ include "tabularia.env" (.Values.containers.enabled) }}
{{- if .Values.externalServices.clickhouse.enabled }}
# Optional engine: transformations execute on the remote server instead of in
# the worker process.
CLICKHOUSE_EXTERNAL__HOST: {{ required "externalServices.clickhouse.host is required when enabled" .Values.externalServices.clickhouse.host | quote }}
CLICKHOUSE_EXTERNAL__PORT: {{ include "tabularia.env" (.Values.externalServices.clickhouse.port) }}
CLICKHOUSE_EXTERNAL__SECURE: {{ include "tabularia.env" (.Values.externalServices.clickhouse.secure) }}
CLICKHOUSE_EXTERNAL__DATABASE: {{ include "tabularia.env" (.Values.externalServices.clickhouse.database) }}
CLICKHOUSE_EXTERNAL__USERNAME: {{ include "tabularia.env" (.Values.externalServices.clickhouse.username) }}
CLICKHOUSE_EXTERNAL__TRANSPORT: {{ include "tabularia.env" (.Values.externalServices.clickhouse.transport) }}
CLICKHOUSE_EXTERNAL__S3_ENDPOINT: {{ include "tabularia.env" (.Values.externalServices.clickhouse.s3Endpoint) }}
CLICKHOUSE_EXTERNAL__CONNECT_TIMEOUT: {{ include "tabularia.env" (.Values.externalServices.clickhouse.connectTimeout) }}
CLICKHOUSE_EXTERNAL__MAX_EXECUTION_TIME: {{ include "tabularia.env" (.Values.externalServices.clickhouse.maxExecutionTime) }}
CLICKHOUSE_EXTERNAL__MATERIALIZE_MIN_ROWS: {{ include "tabularia.env" (.Values.externalServices.clickhouse.materializeMinRows) }}
CLICKHOUSE_EXTERNAL__MATERIALIZE_DATABASE: {{ include "tabularia.env" (.Values.externalServices.clickhouse.materializeDatabase) }}
CLICKHOUSE_EXTERNAL__MATERIALIZE_TTL_SECONDS: {{ include "tabularia.env" (.Values.externalServices.clickhouse.materializeTtlSeconds) }}
CLICKHOUSE_EXTERNAL__PARQUET_SCAN_MAX_THREADS: {{ include "tabularia.env" (.Values.externalServices.clickhouse.parquetScanMaxThreads) }}
{{- with .Values.externalServices.clickhouse.aiUsername }}
# Read-only user for the AI assistant's queries (password in the Secret)
CLICKHOUSE_EXTERNAL__AI_USERNAME: {{ . | quote }}
{{- end }}
{{- with .Values.externalServices.clickhouse.s3NamedCollection }}
# Credentials held on the ClickHouse server: the S3 keys never travel inside a
# query, so they never reach the server's query_log.
CLICKHOUSE_EXTERNAL__S3_NAMED_COLLECTION: {{ . | quote }}
{{- end }}
{{- end }}

{{- if .Values.ai.enabled }}
# AI assistant (gateway): an OpenAI-compatible endpoint
AI__BASE_URL: {{ required "ai.baseUrl is required when ai.enabled" .Values.ai.baseUrl | quote }}
AI__ACCESS_KEY: {{ include "tabularia.env" (.Values.ai.accessKey) }}
AI__DEFAULT_MODEL: {{ include "tabularia.env" (.Values.ai.defaultModel) }}
AI__MAX_RESULT_ROWS: {{ include "tabularia.env" (.Values.ai.maxResultRows) }}
AI__MAX_REQUESTS: {{ include "tabularia.env" (.Values.ai.maxRequests) }}
AI__MAX_FLOW_REQUESTS: {{ include "tabularia.env" (.Values.ai.maxFlowRequests) }}
# Spending caps (dollars): per turn, per user per day, whole installation per day
AI__MAX_COST_PER_TURN_USD: {{ include "tabularia.env" (.Values.ai.maxCostPerTurnUsd) }}
AI__MAX_COST_PER_DAY_USD: {{ include "tabularia.env" (.Values.ai.maxCostPerDayUsd) }}
AI__MAX_COST_PER_DAY_TOTAL_USD: {{ include "tabularia.env" (.Values.ai.maxCostPerDayTotalUsd) }}
{{- end }}

{{- if .Values.externalServices.bigquery.enabled }}
# Optional engine: transformations run on Google BigQuery, reading the parquet
# files from the (GCS) bucket as temporary external tables.
BIGQUERY__PROJECT: {{ required "externalServices.bigquery.project is required when enabled" .Values.externalServices.bigquery.project | quote }}
BIGQUERY__LOCATION: {{ include "tabularia.env" (.Values.externalServices.bigquery.location) }}
BIGQUERY__MAXIMUM_BYTES_BILLED: {{ include "tabularia.env" (.Values.externalServices.bigquery.maximumBytesBilled) }}
{{- end }}
{{- end -}}

{{- /* extraEnv adds what this file does not set; it never overrides it */ -}}
{{- $fixed := include "tabularia.configData" . | fromYaml -}}
{{- /* and the ones set container by container, which would cover a ConfigMap value */ -}}
{{- $perContainer := list "APP__ROLE" "APP__GATEWAY_THREADS" "CELERY__WORKER_CONCURRENCY" "MALLOC_ARENA_MAX"
      "KUBERNETES__SCALING" "KUBERNETES__CLUSTER_VIEW" "KUBERNETES__NAMESPACE" "KUBERNETES__RELEASE" "KUBERNETES__APP_NAME" "KUBERNETES__ROLLOUT"
      "KUBERNETES__RUN_WORKER_DEPLOYMENT" "KUBERNETES__RUN_WORKER_AUTOSCALER" "KUBERNETES__RUN_WORKER_MAX_REPLICAS"
      "KUBERNETES__PREVIEW_WORKER_DEPLOYMENT" "KUBERNETES__PREVIEW_WORKER_AUTOSCALER" "KUBERNETES__PREVIEW_WORKER_MAX_REPLICAS"
      "SCRIPTS__ENABLED" "SCRIPTS__NAMESPACE" "SCRIPTS__TRIAL_NAMESPACE" "SCRIPTS__BUILD_NAMESPACE" "SCRIPTS__REGISTRY"
      "SCRIPTS__REGISTRY_INSECURE" "SCRIPTS__REGISTRY_PUSH_SECRET" "SCRIPTS__REGISTRY_PULL_SECRET" "SCRIPTS__REGISTRY_CA_CONFIGMAP"
      "SCRIPTS__BASE_IMAGES" "SCRIPTS__BUILDER_IMAGE" "SCRIPTS__PYPI_INDEX_URL" "SCRIPTS__CRAN_URL"
      "CONTAINERS__NAMESPACE" "CONTAINERS__TRIAL_NAMESPACE" "CONTAINERS__MAX_CPU" "CONTAINERS__MAX_MEMORY" "CONTAINERS__MAX_TIMEOUT_SECONDS"
      "NUXT_PUBLIC_API_BASE" "NUXT_PUBLIC_BUCKET" "NUXT_PUBLIC_GRAFANA_URL" -}}
{{- range $name, $_ := .Values.extraEnv }}
{{- if or (hasKey $fixed $name) (has $name $perContainer) }}
{{- fail (printf "extraEnv.%s: the chart already sets %s from its own value in values.yaml - change that one" $name $name) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tabularia.configMapName" . }}
  labels:
    {{- include "tabularia.labels" . | nindent 4 }}
data:
  {{- /* nindent would leave two spaces on the blank lines */ -}}
  {{- regexReplaceAll "(?m)^ +$" (include "tabularia.configData" . | nindent 2) "" }}
{{- with .Values.extraEnv }}
  # extraEnv
{{- range $name, $value := . }}
  {{ $name }}: {{ include "tabularia.env" $value }}
{{- end }}
{{- end }}
