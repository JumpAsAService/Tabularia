{{- if .Values.networkPolicy.enabled }}
{{/*
Two policies, for two different reasons.

1. The engine API accepts traffic only from the gateway (both its workloads: the
   pods that answer requests and the orchestrator) and the workers. It holds
   credentials that read the whole bucket, so "internal only" is enforced by the
   network, not by the absence of an Ingress — and, behind it, by the internal
   token every gateway request carries.

2. Egress from the backend roles is restricted to the destinations you list.
   This is the mitigation for the open SSRF gap: a user who can create database
   connections can otherwise make the engine connect anywhere the cluster can
   reach, including cloud metadata endpoints. Tabularia does not filter those
   destinations itself — see README → Known limits.

Add every database, object storage and identity provider your users legitimately
need to networkPolicy.egressCIDRs, or these policies will break real work.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tabularia.fullname" . }}-engine-ingress
  labels:
    {{- include "tabularia.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tabularia.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: engine
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "tabularia.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "tabularia.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: orchestrator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "tabularia.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "tabularia.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: preview-worker
      ports:
        - protocol: TCP
          port: 8000
{{- /* the namespaces of the dependencies the values name as in-cluster Services
(valkey.deps.svc.cluster.local → deps): reached without asking for their CIDR */}}
{{- $namespaces := .Values.networkPolicy.egressNamespaces | default list }}
{{- $hosts := list .Values.externalServices.redis.host (urlParse (.Values.externalServices.storage.endpoint | default "")).host }}
{{- if .Values.externalServices.clickhouse.enabled }}
{{- $hosts = append $hosts .Values.externalServices.clickhouse.host }}
{{- end }}
{{- range $hosts }}
{{- $labels := splitList "." (first (splitList ":" (. | default ""))) }}
{{- if and (ge (len $labels) 3) (eq (index $labels 2) "svc") }}
{{- $namespaces = append $namespaces (index $labels 1) }}
{{- end }}
{{- end }}
{{- if or .Values.networkPolicy.egressCIDRs .Values.networkPolicy.egressNamespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tabularia.fullname" . }}-backend-egress
  labels:
    {{- include "tabularia.labels" . | nindent 4 }}
spec:
  podSelector:
    # name and instance too: a bare component label would also restrict another
    # release's (or another app's) pods labelled worker or engine in this namespace
    matchLabels:
      app.kubernetes.io/name: {{ include "tabularia.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [engine, worker, preview-worker, beat]
  policyTypes:
    - Egress
  egress:
    # DNS, or nothing resolves.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # In-cluster traffic in this namespace (broker, storage when installed next to it).
    - to:
        - podSelector: {}
    {{- with ($namespaces | uniq) }}
    # The namespaces of the broker, the storage and ClickHouse when they are Services
    # of this cluster, and networkPolicy.egressNamespaces.
    - to:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
    {{- end }}
    # Everything the workers are allowed to reach outside the cluster. An entry
    # is a CIDR, or {cidr, except}. The cloud metadata endpoints are carved out of
    # any range that contains them (0.0.0.0/0, 169.254.0.0/16, ::/0…): from there a
    # connection or a SQL file function would read the node's cloud credentials.
    {{- range .Values.networkPolicy.egressCIDRs }}
    {{- $cidr := . }}
    {{- $except := list }}
    {{- if kindIs "map" . }}
    {{- $cidr = required "networkPolicy.egressCIDRs: an entry given as a map needs `cidr`" .cidr }}
    {{- $except = .except | default list }}
    {{- end }}
    {{- if include "tabularia.coversMetadata" $cidr }}
    {{- $except = append $except (ternary "fd00:ec2::254/128" "169.254.169.254/32" (contains ":" $cidr)) }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
            {{- with ($except | uniq) }}
            except:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
    {{- end }}
{{- end }}
{{- end }}
