# The Stan code generator of the Bayesian editor (gateway-go/internal/bayescodegen,
# docs/specs/bayes-stan-codegen.md): its suite (golden programs, properties, the fuzzer's seeds), then
# the stanc check — every golden program and every program the properties' generator writes parses
# and type-checks with the pinned stanc 2.40.0, and its `stanc --info` matches the manifests and the
# catalogue's allow-list (CrossCheck); so does every valid graph of the validator's corpora (bayesgraph's
# corpus and the mirror's), without an extension and with predictive-checks' (bayeschecks), and every
# internal function of the catalogue is a function stanc knows (bayescatalog).
#
# stanc is the asset `linux-stanc` of the stanc3 v2.40.0 release, downloaded by URL and checked
# against the sha256 pinned here (the digest of the prebuilt bin/linux-stanc of the CmdStan 2.40.0
# tarball the model image is built from, gateway-go/internal/modelgroups/groups/bayes/recipe.json:
# docs/specs/bayes-image.md, «As built»). BAYES_STANC_REQUIRED=1 makes a missing stanc a failure of
# the test, not a skip. The suite runs in the same Go image as the gateway's (ci.yml).
#
# Not here: the 10-minute fuzzing run (by hand, alone) and the measure on the image (build tag
# bayesimage, a full CmdStan build).

name: Bayesian codegen

on:
  push:
    paths:
      - "gateway-go/internal/bayescodegen/**"
      - "gateway-go/internal/bayesgraph/**"
      - "gateway-go/internal/bayesexpr/**"
      - "gateway-go/internal/bayescatalog/**"
      - "gateway-go/internal/bayeschecks/**"
      - "gateway-go/internal/bayescontract/**"
      - "gateway-go/go.mod"
      - "gateway-go/go.sum"
      - ".github/workflows/bayes-codegen.yml"
  pull_request:
    paths:
      - "gateway-go/internal/bayescodegen/**"
      - "gateway-go/internal/bayesgraph/**"
      - "gateway-go/internal/bayesexpr/**"
      - "gateway-go/internal/bayescatalog/**"
      - "gateway-go/internal/bayeschecks/**"
      - "gateway-go/internal/bayescontract/**"
      - "gateway-go/go.mod"
      - "gateway-go/go.sum"
      - ".github/workflows/bayes-codegen.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_IMAGE: golang:1.27.3-bookworm
  STANC_VERSION: v2.40.0
  STANC_SHA256: 29306a35092c7f6c1aa20df903ddb9dcd83af5995ba37630324a2e019d05e6f4

jobs:
  codegen:
    name: the generated programs pass stanc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download stanc and check its sha256
        run: |
          mkdir -p "$RUNNER_TEMP/stanc"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/stanc/linux-stanc" \
            "https://github.com/stan-dev/stanc3/releases/download/${STANC_VERSION}/linux-stanc"
          echo "${STANC_SHA256}  $RUNNER_TEMP/stanc/linux-stanc" | sha256sum --check -
          chmod 755 "$RUNNER_TEMP/stanc/linux-stanc"
          "$RUNNER_TEMP/stanc/linux-stanc" --version

      - name: gofmt, go vet, the suite and the stanc check
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e GOCACHE=/tmp/gocache -e GOPATH=/tmp/go \
            -e BAYES_STANC=/stanc/linux-stanc -e BAYES_STANC_REQUIRED=1 \
            -v "$PWD/gateway-go":/src -v "$RUNNER_TEMP/stanc":/stanc:ro -w /src "$GO_IMAGE" \
            sh -c 'test -z "$(gofmt -l internal/bayescodegen internal/bayeschecks)" || { gofmt -l internal/bayescodegen internal/bayeschecks; echo "gofmt: the files above"; exit 1; }
                   go vet ./internal/bayescodegen/... ./internal/bayeschecks/... &&
                   go test -count=1 ./internal/bayescodegen/... ./internal/bayeschecks/... ./internal/bayesgraph/... ./internal/bayesexpr/... ./internal/bayescatalog/... &&
                   go test -count=1 -v -run "Stanc" ./internal/bayescodegen/ ./internal/bayeschecks/ ./internal/bayescatalog/'
