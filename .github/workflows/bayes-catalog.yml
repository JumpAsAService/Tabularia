# The distributions of the Bayesian editor are declared once, in Go
# (gateway-go/internal/bayescatalog/declare.go). What the other components read is its snapshot
# (gateway-go/internal/bayescatalog/catalog.json, embedded by the gateway), of which each keeps
# a copy: the interface (frontend/assets/bayes-catalog.json). This fails when a copy differs
# from the snapshot by a byte, and when a distribution is not named in
# docs/capabilities/bayesian-models.md (once that page exists). That the snapshot is what the
# declarations say is checked by the gateway's suite (catalog_test.go).
#
# The templates of the editor (gateway-go/internal/bayestemplates/templates.json) are checked the same
# way against frontend/assets/bayes-templates.json (.github/scripts/bayes_templates.py).
#
# Fix locally with:  python3 .github/scripts/bayes_catalog.py  (or bayes_templates.py)
# Standard library only: no dependency is installed.

name: Bayesian catalogue

on:
  push:
    paths:
      - "gateway-go/internal/bayescatalog/catalog.json"
      - "frontend/assets/bayes-catalog.json"
      - "gateway-go/internal/bayestemplates/templates.json"
      - "frontend/assets/bayes-templates.json"
      - "docs/capabilities/bayesian-models.md"
      - ".github/scripts/bayes_catalog.py"
      - ".github/scripts/test_bayes_catalog.py"
      - ".github/scripts/bayes_templates.py"
      - ".github/scripts/test_bayes_templates.py"
      - ".github/workflows/bayes-catalog.yml"
  pull_request:
    paths:
      - "gateway-go/internal/bayescatalog/catalog.json"
      - "frontend/assets/bayes-catalog.json"
      - "gateway-go/internal/bayestemplates/templates.json"
      - "frontend/assets/bayes-templates.json"
      - "docs/capabilities/bayesian-models.md"
      - ".github/scripts/bayes_catalog.py"
      - ".github/scripts/test_bayes_catalog.py"
      - ".github/scripts/bayes_templates.py"
      - ".github/scripts/test_bayes_templates.py"
      - ".github/workflows/bayes-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: the copies of the catalogue are the snapshot
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The script's tests and the check of the committed copies
        run: python3 .github/scripts/test_bayes_catalog.py -v

      - name: The templates' script tests and the check of the committed copy
        run: python3 .github/scripts/test_bayes_templates.py -v
