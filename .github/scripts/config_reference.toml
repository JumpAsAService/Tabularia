[var.CELERY__RESULT_BACKEND]
text = "Result store, likewise. Empty = built from `REDIS__*`."

[var.CELERY__WORKER_CONCURRENCY]
text = "Processes per worker container (each runs one task at a time). The preview workers have their own value (`PREVIEW_WORKER_CONCURRENCY` in Compose)."
helm = "`worker.concurrency`, `previewWorker.concurrency`"

[var.CELERY__TASK_SOFT_TIME_LIMIT]
text = "Seconds after which a task is told to stop, so it can close files and connections and report the failure before the hard limit. Keep it below `CELERY__TASK_TIME_LIMIT`."

[var.CELERY__TASK_SERIALIZER]
text = "Format of the task messages. JSON is a security property (no pickled objects): leave it."

[var.CELERY__RESULT_SERIALIZER]
text = "Format of the results. Leave it."

[var.CELERY__TIMEZONE]
text = "Clock of beat's periodic tasks. Leave it on UTC: the gateway converts schedules to UTC before queuing them."

[var.CELERY__ENABLE_UTC]
text = "Celery's own UTC switch. Leave it."

[var.CELERY__MAX_TASKS_PER_CHILD]
text = "A worker process is replaced after this many tasks, so memory the allocator keeps does not pile up."

[var.CELERY__MAX_MEMORY_PER_CHILD_KB]
text = "Resident memory (KB) past which a worker process is replaced at the end of its task. Empty = worked out from the container's memory limit × `CELERY__MAX_MEMORY_HEADROOM_FRAC` ÷ concurrency, never below the floor: set it only to force a fixed value."

[var.CELERY__MAX_MEMORY_HEADROOM_FRAC]
text = "Share of the container's memory limit given to the worker processes; the rest is margin for the main process and the page cache."

[var.CELERY__MAX_MEMORY_PER_CHILD_FALLBACK_KB]
text = "The cap used when the container has no readable memory limit."

[var.CELERY__MAX_MEMORY_PER_CHILD_FLOOR_KB]
text = "The cap is never below this, so processes are not replaced too often."

[var.WORKERS__RUN_CONCURRENCY]
text = "Processes per run-worker container, resized within seconds without stopping running tasks. 0 = keep `CELERY__WORKER_CONCURRENCY`."

[var.WORKERS__PREVIEW_CONCURRENCY]
text = "The same for the preview workers."

[var.CACHE__TTL_SECONDS]
text = "A cached step unused for this long is deleted (its parquet and its index entry)."

[var.CACHE__SWEEP_INTERVAL_SECONDS]
text = "How often the cache is swept."

[var.CACHE__MAX_STEP_ROWS]
text = "Steps with more rows are not cached: a copy as large as the source saves nothing over re-reading it and costs gigabytes of writes. 0 = no cap."

[var.METRICS__STORAGE_STATS_INTERVAL_SECONDS]
text = "How often the size of the storage prefixes is measured and published as a metric."

[var.CHDB_MAX_MEMORY_USAGE]
text = "Memory budget of the embedded chDB engine, in bytes; keep it under the worker's per-process cap."
