# The hand-written half of docs/configuration.md; config_reference.py writes the rest
# (names, types, defaults, bounds, Helm keys) from the code. After a change here or in the
# settings, run:  python3 .github/scripts/config_reference.py
#
# [var.NAME] keys:
#   text        the explanation (required); one or two sentences, no defaults (they come from the code)
#   production  a «change it before production» note, also listed at the top of the page
#   required    true: the process refuses to start without it (shown instead of the default)
#   secret      true: never show the default (SecretStr fields and the chart's Secret keys are already)
#   default     what to show instead of the default worked out from the code
#   type        what to show instead of the type worked out from the code
#   values      appended to the type: what the code accepts beyond what the annotation says
#   helm        what to show instead of the Helm key read from the chart
#   section     for a variable without a `SECTION__` prefix: the id of its [[section]]
#   where       deployment-only variables: where they apply

[page]
title = "Configuration reference"
intro = """
Every setting of Tabularia is an environment variable. This page lists all of them: the
ones the gateway and the engine read, the frontend's, and the few that only the Docker
Compose files and the Helm chart use. It is generated from the code by
[`.github/scripts/config_reference.py`](../.github/scripts/config_reference.py), and a
check fails when a variable is added, removed or changed without the page following:
edit the code or [`config_reference.toml`](../.github/scripts/config_reference.toml),
never this page.

**Nested names.** The settings are grouped in sections, and a variable names the section
and the field with a double underscore: `STORAGE__BUCKET` is the `bucket` field of the
`storage` section, `CLICKHOUSE_EXTERNAL__S3_ENDPOINT` the `s3_endpoint` field of
`clickhouse_external`. Write them in capitals. Booleans are `true` or `false`, lists are
JSON (`APP__CORS_ORIGINS=["https://app.example.com"]`), and a variable left out keeps the
default shown below. Keep comments on their own line: not every tool strips a trailing
`# comment` from a value.

**Where to set them.**

- *Docker Compose*: in `infrastructure/.env`, a copy of
  [`infrastructure/.env.example`](../infrastructure/.env.example). The gateway and
  engine containers read the whole file, so one value reaches every service that needs
  it. Compose is the way to try Tabularia; production runs on Kubernetes with the Helm
  chart ([Kubernetes guide](deploy/kubernetes.md)).
- *Helm*: the **Helm value** column gives the key of `values.yaml` the chart renders the
  variable from. A variable without one goes in `extraEnv`, by its name (it lands in the
  shared ConfigMap; the chart refuses a name it already sets), or, for a secret, in the
  Secret you name in `existingSecret`. See [Deploying on Kubernetes](deploy/kubernetes.md).

**Who reads what.** The *gateway* is the control plane (API, sign-in, permissions,
schedules, flow orchestration), in one process or split into `api` and `orchestrator`
copies (`APP__ROLE`). The *engine* is one image with several roles: the internal engine
API, the run and preview workers, and the beat scheduler; they all read the same
settings. The *frontend* reads three public values at startup. A variable only matters to
the service it is listed under; giving it to the others is harmless.

**Secrets** are never printed here. *required* means the process refuses to start
without the variable; *development value (hidden)* means a placeholder that works on a
laptop and must be replaced before anyone else can reach the installation (the gateway
refuses some of them when `APP__ENV_NAME=production`).

**Not in the environment.** Some things are set in the administration panel instead: the
engine parameters marked *Also adjustable in Administration → Settings* (the variable is
the starting value, see [engine settings](engine-settings.md)), the processes per worker
(Administration → Workers), the AI models people may use, the engines allowed, the
forwarding of the audit log to a SIEM ([Splunk](siem-splunk.md)), webhook receivers and
service accounts ([API](api.md)), and the banners. Connection credentials (databases,
SFTP, S3, APIs, SharePoint) belong to each connection, encrypted with
`SECURITY__FERNET_KEY`.
"""
production_title = "Before production"
production_intro = """
The defaults are made for a laptop. Before an installation is reachable by anyone else,
set at least these (the [release checklist](deploy/release-checklist.md) lists what
changed between versions):
"""
shared_intro = """
Read by the gateway and by the engine. Give both the same value: the Compose file and the
chart do, since every container reads the same `.env` or ConfigMap.
"""
gateway_intro = """
The control plane: in Compose the `gateway` service; on Kubernetes the `gateway` (`api`)
and `orchestrator` workloads.
"""
engine_intro = """
The data plane: in Compose the `backend`, `worker`, `preview-worker` and `beat`
services; on Kubernetes the engine, the two worker Deployments and beat. Same image, same
settings: a variable that concerns only one role says so.
"""
frontend_intro = """
The Nuxt server reads these at startup (`NUXT_PUBLIC_…` is Nuxt's own runtime
configuration), so one image serves every environment without a rebuild. The browser
calls the gateway directly; the frontend server never does. The development Compose file
sets them in the `frontend` service itself, not from `.env`.
"""
deployment_intro = """
Not read by Tabularia's code: the Compose files and the Helm chart use them to configure
containers.
"""
components = { shared = "Shared by the gateway and the engine", gateway = "Gateway", engine = "Engine and workers", frontend = "Frontend", deployment = "Compose and Helm only" }
outro_title = "Changing this page"
outro = """
The page is generated. Names, types, defaults, bounds and Helm keys come from the code:
the settings classes of [`gateway/app/core/config.py`](../gateway/app/core/config.py) and
[`backend/app/core/config.py`](../backend/app/core/config.py), the direct reads of the
environment in both apps, `frontend/nuxt.config.ts`, the development Compose file,
`infrastructure/.env.example` and the chart's templates. The explanations come from
[`.github/scripts/config_reference.toml`](../.github/scripts/config_reference.toml).
After changing either, run `python3 .github/scripts/config_reference.py`;
`--check` (run by the *Configuration reference* workflow, and by
`python3 .github/scripts/test_config_reference.py`) fails while the page and the code
disagree.
"""

# ── Sections ─────────────────────────────────────────────────────────────────
# Order here = order on the page. A variable lands in the section of its component whose
# `prefixes` hold the part of its name before `__` (or the one its `section` names).

[[section]]
id = "gateway-process"
component = "gateway"
title = "Process and HTTP"
prefixes = ["APP"]

[[section]]
id = "gateway-db"
component = "gateway"
title = "Metadata database (Postgres)"
prefixes = ["DB"]
intro = "Users, groups, permissions, flows, connections, runs, schedules and the audit log. The schema is migrated with Alembic: see [database migrations](database-migrations.md)."

[[section]]
id = "gateway-auth"
component = "gateway"
title = "Sign-in, sessions and API tokens"
prefixes = ["JWT", "AUTH"]
intro = "Local sign-in and the session cookie, the first administrator, and the API tokens of scripts and service accounts ([API](api.md))."

[[section]]
id = "gateway-sso"
component = "gateway"
title = "Single sign-on (OIDC)"
prefixes = ["OIDC"]
intro = "Optional: Keycloak, Microsoft Entra ID, Auth0, Okta… Off while `OIDC__ISSUER` is empty; when it is set, the gateway configures itself from the issuer's discovery document and refuses to start if the client secret, redirect URI or post-login URL is missing. Runnable example: [`docs/examples/keycloak/`](examples/keycloak/); how groups are mapped: [SSO group mapping](design/sso-group-mapping.md)."

[[section]]
id = "gateway-engine"
component = "gateway"
title = "Link to the engine"
prefixes = ["ENGINE"]

[[section]]
id = "gateway-ai"
component = "gateway"
title = "AI assistant"
prefixes = ["AI"]
intro = "Optional: a chat over the catalog and an assistant in the flow editor, against any OpenAI-compatible endpoint. Off until `AI__BASE_URL` and `AI__SECRET_KEY` are set, and no model is usable until an administrator enables it. On the external ClickHouse the assistant can run as a read-only user: see [the AI user](engines/clickhouse-ai-user.md). The dbt export uses it too ([dbt export](dbt-export.md))."

[[section]]
id = "gateway-preview"
component = "gateway"
title = "Development sample"
prefixes = ["PREVIEW"]

[[section]]
id = "gateway-orchestration"
component = "gateway"
title = "Orchestration and scheduling"
prefixes = ["ORCHESTRATOR", "SCHEDULING"]
intro = "How flows are executed: queued in the database, picked up by an orchestrator process (`APP__ROLE` `all` or `orchestrator`), which waits for each step to complete before the next."

[[section]]
id = "gateway-backup"
component = "gateway"
title = "Database backups"
prefixes = ["BACKUP"]
intro = "Kubernetes only (on Docker Compose Administration → Backups is greyed out). The automatic backup of the metadata database: an orchestrator runs `pg_dump` on the schedule and streams it to the engine, which stores it in the object storage and removes the oldest beyond the number to keep. `BACKUP__ENABLED`, `BACKUP__SCHEDULE` and `BACKUP__KEEP` are the installation's defaults, which Administration → Backups can change without a restart; where the files go is read by the engine. By default Tabularia's bucket under `backups/postgres/`: in production give the backups a bucket of their own. Restoring one: [Upgrading](deploy/upgrading.md#when-something-goes-wrong)."

[[section]]
id = "gateway-openlineage"
component = "gateway"
title = "OpenLineage"
prefixes = ["OPENLINEAGE"]
intro = "Optional: what every run read and wrote, sent to a catalog in the OpenLineage standard (Marquez, DataHub, Astro…). Off when neither `OPENLINEAGE__URL` nor `OPENLINEAGE__FILE` is set. See [OpenLineage](openlineage.md)."

[[section]]
id = "gateway-webhooks-audit"
component = "gateway"
title = "Webhooks and audit log"
prefixes = ["WEBHOOKS", "AUDIT"]
intro = "Webhook receivers are added in Administration → Webhooks ([API](api.md)); forwarding the audit log to a SIEM is set up in Administration → SIEM ([Splunk](siem-splunk.md)). Neither has an environment variable beyond these."

[[section]]
id = "gateway-monitoring"
component = "gateway"
title = "Monitoring"
prefixes = ["MONITORING"]

[[section]]
id = "gateway-kubernetes"
component = "gateway"
title = "Worker autoscaling from the panel (Kubernetes)"
prefixes = ["KUBERNETES"]
intro = "Lets an administrator change the minimum and maximum number of worker pods from Administration → Workers. Off unless `KUBERNETES__SCALING` is true; the chart sets the whole block, and a service account allowed to read the two worker Deployments and change their autoscalers, with `adminScaling.enabled` ([Deploying on Kubernetes](deploy/kubernetes.md))."

[[section]]
id = "gateway-scripts"
component = "gateway"
title = "Scripting environments (Kubernetes)"
prefixes = ["SCRIPTS"]
intro = "Administration → Scripting environments: the Python and R environments the Script node runs in, each built once into an image by a Kubernetes Job (rootless BuildKit) and checked by a second Job. Off unless `SCRIPTS__ENABLED` is true; the chart sets the whole block, the three namespaces and the service accounts of the gateway and the orchestrator allowed to run Jobs there (only the orchestrator's creates the builds), with `scripts.enabled`. The Kubernetes API is reached as in `KUBERNETES__API_URL`, `KUBERNETES__TOKEN_FILE` and `KUBERNETES__CA_FILE` ([Scripting environments](scripting.md))."

[[section]]
id = "gateway-containers"
component = "gateway"
title = "Container registries (Kubernetes)"
prefixes = ["CONTAINERS"]
intro = "Administration → Container registries: the registries the images of the Container node come from, their credentials, how to trust their certificate and the repositories allowed ([Container registries](container-registries.md)). Off unless `CONTAINERS__ENABLED` is true; the chart sets it with `containers.enabled`."

[[section]]
id = "engine-api"
component = "engine"
title = "Engine API and previews"
prefixes = ["APP"]
intro = "The internal API the gateway calls (never exposed publicly). It hands previews to the `preview` queue and waits for the answer."

[[section]]
id = "engine-redis"
component = "engine"
title = "Broker and cache index (Valkey or Redis)"
prefixes = ["REDIS"]

[[section]]
id = "engine-storage"
component = "engine"
title = "Object storage"
prefixes = ["STORAGE"]
intro = "Any S3-compatible service: MinIO, AWS S3, Cloudflare R2, Backblaze B2, Scaleway, Google Cloud Storage through its S3 API (needed by the BigQuery engine). Every datasource snapshot, cached step and run output lives here."

[[section]]
id = "engine-backup"
component = "engine"
title = "Where the database backups go"
prefixes = ["BACKUP"]
intro = "The gateway makes the backups of its database (see *Database backups* above); the engine stores them, since it holds the storage credentials. Every field left empty falls back to the object storage's."

[[section]]
id = "engine-workers"
component = "engine"
title = "Workers and task limits (Celery)"
prefixes = ["CELERY", "WORKERS"]
intro = "How long a run may take is decided by three coupled values: `CELERY__TASK_TIME_LIMIT` (the worker kills the task), `CELERY__TASK_SOFT_TIME_LIMIT` (the task is told to stop shortly before) and the gateway's `ENGINE__RUN_STALE_TIMEOUT_SECONDS` (the gateway declares a silent run lost), which must stay above the hard limit. To allow longer runs, raise the hard limit and the stale timeout together."

[[section]]
id = "engine-cache"
component = "engine"
title = "Step cache and metrics"
prefixes = ["CACHE", "METRICS"]
intro = "The editor keeps the output of intermediate steps, so the next preview starts from there instead of from the source."

[[section]]
id = "engine-embedded"
component = "engine"
title = "Embedded engines (chDB, DuckDB, Polars)"
prefixes = []
intro = "The engines that run inside the worker process. See [engine differences](engines/engine-differences.md)."

[[section]]
id = "engine-clickhouse"
component = "engine"
title = "External ClickHouse engine"
prefixes = ["CLICKHOUSE_EXTERNAL"]
intro = "Optional: flows run on a remote ClickHouse server (managed or self-hosted) instead of in the worker. Off while `CLICKHOUSE_EXTERNAL__HOST` is empty. Use the HTTP(S) port (8123 / 8443), not the native one."

[[section]]
id = "engine-bigquery"
component = "engine"
title = "BigQuery engine"
prefixes = ["BIGQUERY"]
intro = "Optional: flows run on Google BigQuery, which reads the parquet files from the bucket as temporary external tables, so `STORAGE__ENDPOINT` must be Google Cloud Storage (`https://storage.googleapis.com`, HMAC keys). The service account needs *BigQuery Job User* on the project and read access to the bucket. Off while the project or the credentials are empty."

[[section]]
id = "engine-ingest"
component = "engine"
title = "Imports and downloads"
prefixes = ["INGEST", "EXPORT"]
intro = "Database imports stream Arrow batches into parquet snapshots; a CSV or Excel download goes through the browser."

[[section]]
id = "engine-sharepoint"
component = "engine"
title = "SharePoint datasources"
prefixes = ["SHAREPOINT"]
intro = "Excel and CSV files on SharePoint are read through Microsoft Graph with an app registered on Entra ID; tenant, client and site belong to the connection. These two endpoints are deployment settings on purpose: whoever creates a connection cannot point the backend at another host."

[[section]]
id = "engine-sftp"
component = "engine"
title = "SFTP datasources"
prefixes = ["SFTP"]
intro = "Caps of the «SFTP folder» datasource, checked on the listed sizes before anything is downloaded: going over one fails the import, naming the file. See [SFTP](sftp.md)."

[[section]]
id = "engine-s3"
component = "engine"
title = "S3 folder datasources"
prefixes = ["S3_SOURCE"]
intro = "Caps of the «S3 folder» datasource, checked on the object listing before anything is downloaded. See [S3 datasources](s3-datasource.md)."

[[section]]
id = "engine-api-datasources"
component = "engine"
title = "API datasources"
prefixes = ["API"]
intro = "Caps and manners of the «API call» datasource. A datasource may lower the per-call, per-refresh and row limits for itself, never raise them above these; going over one fails the refresh with a message that names it, the data is never cut silently. See [API datasources](api-datasource.md)."

[[section]]
id = "engine-placeholders"
component = "engine"
title = "Placeholders"
prefixes = ["PLACEHOLDERS"]
intro = "Dates and lists that move by themselves in the names of inputs and outputs. See [placeholders](placeholders.md)."

[[section]]
id = "engine-email"
component = "engine"
title = "Email"
prefixes = ["SMTP"]
intro = "The SMTP connections of email outputs and notices are set up in the app; the deployment decides only how their servers are trusted."

# ── Shared ───────────────────────────────────────────────────────────────────

[var.APP__ENV_NAME]
text = "`production` turns on the gateway's production guard: it refuses to start with the development secrets (`JWT__SECRET`, `DB__PASSWORD`), an empty or published `AUTH__ADMIN_PASSWORD`, or a `JWT__SECRET` shorter than 32 characters. The engine accepts it and nothing there depends on it."
production = "set it to `production`, so the gateway refuses the development secrets."

[var.APP__CORS_ORIGINS]
text = "Origins allowed to call the API from a browser, with the session cookie. Needed only when the interface is served from another host than the gateway (then set `AUTH__COOKIE_DOMAIN` too). The engine API applies the same list to its own CORS."
values = "`*` and `null` refused"

[var.SECURITY__FERNET_KEY]
text = "Encrypts the credentials of database and file connections, at rest in the gateway and on their way to the engine, which decrypts them only inside the worker. The same value everywhere; never change it once a connection is saved. Empty with `SECURITY__KEYS_DIR` set (the Compose stack): the key created there at the first start. Empty without it: the services refuse to start. Generate one with `openssl rand -base64 32 | tr '+/' '-_'`."
production = "generate a key of your own and keep it with your backups: without it the saved connections cannot be decrypted."

[var.SECURITY__KEYS_DIR]
text = "A directory every service shares on one machine (the Compose stack mounts the `keys` volume there): the secrets left empty are created in it at the first start and read afterwards, `fernet.key` for `SECURITY__FERNET_KEY` and, with `AUTH__FIRST_RUN_SETUP`, `bootstrap.token`, which the sample-data container exchanges for a session once the administrator exists. Back it up with the data. Not for Kubernetes, where the pods share no volume: the chart sets the key."
production = "on Kubernetes leave it empty and set `SECURITY__FERNET_KEY`; with Compose, back the `keys` volume up with the database."

[var.CELERY__TASK_TIME_LIMIT]
text = "Seconds after which the worker kills a task: the real ceiling on a run, an import or a preview. The gateway reads it too, to derive `ENGINE__RUN_STALE_TIMEOUT_SECONDS`."

[var.STORAGE__ENDPOINT]
text = "URL of the S3-compatible object storage, as the workers reach it (`http://minio:9000` in Compose). The gateway reads it only to name the storage in OpenLineage events (`gs://` for Google Cloud Storage)."

# ── Gateway ──────────────────────────────────────────────────────────────────

[var.APP__NAME]
text = "Product name shown by the API. Product identity, not a deployment setting: leave it."

[var.APP__VERSION]
text = "The release, shown by `/system/info` and in the interface's menu. Set by the code; leave it."

[var.APP__CODENAME]
text = "The release's name. Set by the code; leave it."

[var.APP__ROLE]
text = "What this gateway process does: `all` answers requests and does the background work (schedules, flow executions, clean-up); `api` only answers; `orchestrator` only does the background work. Split them to run several copies: they share the work through the database."
helm = "set per workload: `api` for the gateway, `orchestrator` for the orchestrator"

[var.APP__ROOT_PATH]
text = "Path prefix a reverse proxy publishes the gateway under, stripping it before forwarding (`/api` when one host serves interface and API). It fixes the paths the gateway writes for the browser: the SSO cookie, `/docs`, redirects. Empty = published at the root."
values = "a path such as `/api`"

[var.APP__GATEWAY_THREADS]
text = "Threads serving the synchronous routes. More do not serve more (Python runs one at a time); the database pool follows this number. A different name from the engine's `APP__ENGINE_API_THREADS` because both read the same file and want opposite values."

[var.APP__TIMEZONE]
text = "Time zone in which cron schedules are read (wall-clock time, daylight saving included); they are stored in UTC. Timestamps are still shown in each viewer's own time zone."
values = "an IANA name, e.g. `Europe/Rome`"

[var.PREVIEW__DEFAULT_SAMPLE_ROWS]
text = "Above 0, every source node without a sample of its own is read only for its first N rows in editor previews and trial runs. People switch it off per node; scheduled runs and «Run in production» always read everything. Useful when every read costs (remote storage, a pay-per-use warehouse). 0 = no automatic sample."

[var.AI__BASE_URL]
text = "OpenAI-compatible endpoint, e.g. `https://api.scaleway.ai/v1`. Empty = assistant off."

[var.AI__ACCESS_KEY]
text = "Identifier of the key (Scaleway calls it access key); the protocol authenticates with the secret alone, this only tells which key is in use."

[var.AI__SECRET_KEY]
text = "The API key. Empty = assistant off."

[var.AI__DEFAULT_MODEL]
text = "Model proposed first in the picker, if an administrator enabled it."

[var.AI__MAX_RESULT_ROWS]
text = "Rows a query of the assistant may return, to the model and to the chat."

[var.AI__MAX_REQUESTS]
text = "Model round-trips per message of the data chat: the cap on its tool-calling loop."

[var.AI__MAX_FLOW_REQUESTS]
text = "The same for the flow editor's assistant, which takes a round-trip for every step it builds and checks."

[var.AI__MAX_HISTORY_MESSAGES]
text = "Past messages of a conversation replayed to the model: higher remembers more and costs more per turn."

[var.AI__MAX_COST_PER_TURN_USD]
text = "Spending ceiling of one turn, in dollars, enforced by pydantic-ai. The round-trip cap does not limit tokens."

[var.AI__MAX_COST_PER_DAY_USD]
text = "Daily ceiling per user, in dollars. 0 = none."
production = "set it, and `AI__MAX_COST_PER_DAY_TOTAL_USD`, wherever people you do not know can sign in (every question is paid with your key)."

[var.AI__MAX_COST_PER_DAY_TOTAL_USD]
text = "Daily ceiling of the whole installation, in dollars: where many people share one account (a public demo) the per-user ceiling protects nothing. Once reached, the assistant is unavailable until the next day. 0 = none."

[var.AI__MAX_INPUT_TOKENS_PER_TURN]
text = "Input tokens one turn may send to the model."

[var.AI__DBT_EXPORT_TIMEOUT_SECONDS]
text = "Seconds for all the AI calls of one dbt export (descriptions and translations). Keep it, plus `ENGINE__DBT_EXPORT_TIMEOUT_SECONDS`, under the ingress' read timeout (300 s in the chart)."

[var.AI__MAX_CHATS_LISTED]
text = "Conversations listed per person; older ones are not deleted, only left out of the list."

[var.SCHEDULING__WORKER_CAPACITY]
text = "Flow runs one worker is assumed to carry at once: used only to highlight the crowded minutes in the schedule load heatmap. Match it to the run workers' `CELERY__WORKER_CONCURRENCY`."

[var.ORCHESTRATOR__REFRESH_WAIT_SECONDS]
text = "Longest a flow waits for a Refresh node to complete before aborting rather than reading stale data. Raise it for very long refreshes. An Output node has no cap of its own: it is bounded by `ENGINE__RUN_STALE_TIMEOUT_SECONDS`."

[var.ORCHESTRATOR__POLL_INTERVAL_SECONDS]
text = "The longest wait, in seconds, between two checks of a step the flow is waiting for: the first checks come sooner (a quarter of a second, then every second for half a minute)."

[var.ORCHESTRATOR__LOG_RETENTION_DAYS]
text = "After how many days a run's logs are emptied: what a Script or Container node printed, and the engine's full traceback of a failure. The runs stay, with their outcome, short error, timings and exit code. 0 keeps them for ever. With the three settings below, the orchestrators trim this history every hour and then vacuum the tables they touched."

[var.ORCHESTRATOR__CONTRACT_RESULTS_KEPT]
text = "The latest data contract reports kept per datasource; older ones are deleted every hour, never one whose notice is still to be sent. 0 keeps them all."

[var.ORCHESTRATOR__VERSIONS_KEPT]
text = "The latest versions kept per flow and per saved script; the one in use is always kept. 0 keeps them all."

[var.ORCHESTRATOR__AI_CHAT_RETENTION_DAYS]
text = "The assistant's conversations untouched for this many days are deleted, with their turns; the spending ledger stays. 0 keeps them."

[var.BACKUP__ENABLED]
text = "Whether the database is backed up on the schedule. Administration → Backups can turn it off or on; «Back up now» works either way."

[var.BACKUP__SCHEDULE]
text = "When: a five-field cron (`minute hour day month weekday`) in `APP__TIMEZONE`. The process refuses to start with an invalid one."

[var.BACKUP__KEEP]
text = "How many backups stay; after each backup the oldest beyond this number are removed."

[var.BACKUP__PG_DUMP]
text = "The `pg_dump` used when the image has none of the server's own version. The gateway image has those of PostgreSQL 14 to 18 and uses the server's, so that the server's own `pg_restore` reads the backup; this one (18's) also reads older servers."

[var.BACKUP__TIMEOUT_SECONDS]
text = "The longest a backup (the dump and its upload) may take before it is stopped and reported as failed."

[var.BACKUP__BUCKET]
text = "The bucket of the backups; empty = `STORAGE__BUCKET`. A bucket of their own is advised in production, so that losing one does not lose both."

[var.BACKUP__PREFIX]
text = "The folder of the backups in the bucket. Only files named like a backup (`tabularia-<time>.dump`) are listed, downloaded or removed there."

[var.BACKUP__ENDPOINT]
text = "Another object storage for the backups; empty = `STORAGE__ENDPOINT`."

[var.BACKUP__REGION]
text = "The region of `BACKUP__ENDPOINT`; empty = `STORAGE__REGION`."

[var.BACKUP__ACCESS_KEY]
text = "Keys of the backups' bucket when they are not the storage's; empty = `STORAGE__ACCESS_KEY` and `STORAGE__SECRET_KEY`. Read by the engine only: the chart keeps them out of the gateway."

[var.BACKUP__SECRET_KEY]
text = "The secret of `BACKUP__ACCESS_KEY`."

[var.ORCHESTRATOR__QUEUE_POLL_SECONDS]
text = "Seconds between two looks at the queue of flow executions."

[var.ORCHESTRATOR__MAX_CONCURRENT]
text = "Flow executions (and cells of flow groups) one orchestrator process carries at once; the others wait in the queue. Each uses a database connection while it asks the engine about a step: keep it below the pool (`DB__POOL_SIZE`)."

[var.ORCHESTRATOR__QUEUE_TIMEOUT_SECONDS]
text = "An execution still queued after this long (no orchestrator running, or all of them full) is not started any more: it is closed as failed."

[var.ORCHESTRATOR__HEARTBEAT_SECONDS]
text = "How often the process executing a flow says it is still there."

[var.ORCHESTRATOR__DEAD_AFTER_SECONDS]
text = "An execution silent for longer belongs to a process that died: another orchestrator closes it as interrupted. The machines' clocks must agree within this margin."

[var.DB__HOST]
text = "Postgres host."

[var.DB__PORT]
text = "Postgres port."

[var.DB__USER]
text = "Postgres user. The development Compose file also creates the database with it."

[var.DB__PASSWORD]
text = "Postgres password."
production = "replace the development password (the gateway refuses it in production unless `DB__URL` is set)."

[var.DB__NAME]
text = "Postgres database."

[var.DB__URL]
text = "A full DSN (`postgresql://user:password@host:5432/dbname`) for a managed Postgres that does not fit the pieces above; when set it wins over them. It holds the password: treat it as a secret."
secret = true

[var.DB__POOL_SIZE]
text = "Connections kept open to Postgres. Empty = one per thread (`APP__GATEWAY_THREADS`), which is what the gateway needs. Pool plus overflow, summed over every gateway process, must stay under Postgres' `max_connections`."

[var.DB__MAX_OVERFLOW]
text = "Extra connections opened at a peak and closed when returned."

[var.DB__AUTO_MIGRATE]
text = "`true`: the gateway migrates the schema itself at startup (the development Compose file sets it). `false`: migrations are a step of their own (`python -m app.db.migra`, the chart's init container) and the gateway only refuses a database behind its code."

[var.JWT__SECRET]
text = "Signs every session and API token (HS256). Generate one with `openssl rand -hex 32`; changing it signs everybody out."
production = "generate a secret of at least 32 characters (the gateway refuses the default and shorter ones in production)."

[var.JWT__ALGORITHM]
text = "Signature algorithm of the session tokens. Leave it."

[var.JWT__ACCESS_TTL_MINUTES]
text = "The longest a session lasts, active or not. Sessions also end at sign-out, from «Your sessions», by an administrator, at a password change or when the account is disabled."

[var.AUTH__ADMIN_EMAIL]
text = "E-mail of the administrator created at the first start. Existing users are never touched."

[var.AUTH__ADMIN_PASSWORD]
text = "Password of that administrator, used when it is created. No default: the gateway refuses to create the administrator with a published password (`admin`, the guides' examples) or one under 12 characters, in every environment. Empty with `AUTH__FIRST_RUN_SETUP` (the Compose stack): no administrator at the start, the sign-in page creates it. Empty otherwise: the gateway refuses to start. An administrator still holding `admin` from an older release gets this password at the next start, and its sessions close."
production = "set a password of your own before the first start (at least 12 characters; the gateway refuses `admin` and other published passwords)."

[var.AUTH__FIRST_RUN_SETUP]
text = "While no account exists, the sign-in page asks for the first administrator (email and password, the same password rule), signs it in, and from then on is the ordinary sign-in. On with `docker-compose.yml`, which answers on 127.0.0.1 only; `AUTH__ADMIN_PASSWORD`, when set, creates the administrator instead. Ignored with `APP__ENV_NAME=production`."
production = "leave it off: the administrator comes from `AUTH__ADMIN_PASSWORD`."

[var.AUTH__ALLOW_KNOWN_ADMIN_PASSWORD]
text = "Development only: `true` lets a local stack whose scripts sign in with a fixed password (`admin`) create or keep it. Ignored with `APP__ENV_NAME=production`."

[var.AUTH__ADMIN_NAME]
text = "Display name of that administrator."

[var.AUTH__SESSION_IDLE_MINUTES]
text = "Minutes without activity after which a session closes: the gateway refuses it and the open page signs out by itself after a one-minute warning. 0 = never."

[var.AUTH__COOKIE_DOMAIN]
text = "Domain of the session cookie. Empty = the gateway's host, right when interface and API share a host. With the interface on another host of the same domain (`app.example.com` and `api.example.com`) set the common domain, `example.com`; two unrelated domains do not work."

[var.AUTH__PERSONAL_TOKENS]
text = "Whether people may create API tokens for their own scripts, with their own permissions. `false`: only service accounts, created by an administrator, have tokens."

[var.AUTH__API_TOKEN_MAX_DAYS]
text = "The furthest expiry of an API token: every token has one."

[var.ENGINE__BASE_URL]
text = "Internal URL of the engine API (`http://backend:8000` in Compose). The gateway is its only client."
helm = "set by the chart (the engine Service)"

[var.ENGINE__BUCKET]
text = "The gateway's copy of the bucket name, compared with the bucket of every request (a mismatch is refused with 403). It must equal `STORAGE__BUCKET`: the Compose file and the chart derive it from that value, so set it by hand only if you know why."

[var.ENGINE__RUN_STALE_TIMEOUT_SECONDS]
text = "A run that has not reached a final state after this long is declared lost and marked failed. It must stay above `CELERY__TASK_TIME_LIMIT`, so the gateway gives up only after the worker has killed the task."
default = "`CELERY__TASK_TIME_LIMIT` + 300"

[var.ENGINE__SETTINGS_PANEL]
text = "Whether Administration → Settings may change some engine parameters at runtime ([engine settings](engine-settings.md)). `false`: the environment is the only source, the panel shows the values without changing them, and values saved before stop applying."

[var.ENGINE__DBT_EXPORT_TIMEOUT_SECONDS]
text = "Seconds the gateway waits for the engine to build one dbt export; past it the download stops with a clear 504 instead of hanging until the ingress cuts it. Keep it, plus `AI__DBT_EXPORT_TIMEOUT_SECONDS`, under the ingress' read timeout."

[var.OIDC__ISSUER]
text = "Issuer URL, e.g. `https://keycloak.example.com/realms/tabularia` or, for Entra ID, `https://login.microsoftonline.com/<tenant-id>/v2.0`. Empty = SSO off."

[var.OIDC__CLIENT_ID]
text = "Client id registered on the identity provider."

[var.OIDC__CLIENT_SECRET]
text = "Secret of that (confidential) client. Required when SSO is on."

[var.OIDC__REDIRECT_URI]
text = "The gateway's callback, e.g. `https://tabularia.example.com/api/auth/sso/callback`; it must match the one registered on the identity provider exactly. Required when SSO is on."

[var.OIDC__SCOPES]
text = "Scopes asked for, separated by spaces; must include `openid`."

[var.OIDC__GROUPS_CLAIM]
text = "Where the groups are: a claim (`groups` for Keycloak's group mapper, `roles` for Entra ID app roles) or a path into the token, as it appears in the JSON: `realm_access.roles` and `resource_access.<client id>.roles` for Keycloak's realm and client roles (a client id with dots works). Several, comma-separated, are joined: `groups,realm_access.roles`. A path the id_token does not carry is looked up in the access token (Keycloak puts the roles there by default), then in the provider's userinfo."

[var.OIDC__GROUP_ALLOWLIST]
text = "Identity-provider groups mapped onto Tabularia groups, separated by commas. Empty = all of them."

[var.OIDC__AUTO_CREATE_GROUPS]
text = "`true`: create the Tabularia groups missing at sign-in. `false`: map only onto groups an administrator already made."

[var.OIDC__AUTHORITATIVE]
text = "`true`: the identity provider owns group membership (groups absent from the claim are removed). `false`: SSO only adds."

[var.OIDC__SUPERUSER_GROUP]
text = "Members of this group are administrators. Empty = nobody becomes one through SSO."

[var.OIDC__ALLOWED_EMAIL_DOMAINS]
text = "Only people with an e-mail in these domains may sign in, separated by commas. Empty = anyone the identity provider authenticates, which may be a whole company directory."

[var.OIDC__REQUIRE_ALLOWLISTED_GROUP]
text = "`true`: signing in requires one of the groups of `OIDC__GROUP_ALLOWLIST` (or the administrators' group)."

[var.OIDC__POST_LOGIN_URL]
text = "The interface page that receives the session after SSO, e.g. `https://tabularia.example.com/auth/callback`."

[var.OIDC__BUTTON_LABEL]
text = "Label of the SSO button on the sign-in page."

[var.OIDC__DISCOVERY_TTL_SECONDS]
text = "How long the identity provider's discovery document is trusted before it is fetched again."

[var.OIDC__TIMEOUT_SECONDS]
text = "Timeout of the calls to the identity provider."

[var.OIDC__CA_FILE]
text = "A PEM file of the certificate authorities to trust for the identity provider, besides the public ones: a company Keycloak whose certificate the company's own authority signed (without it every sign-in fails with `idp_untrusted`). The chart mounts it from `oidc.caCert` or `oidc.caConfigMap`. The gateway refuses to start when the file is not one."
helm = "oidc.caCert / oidc.caConfigMap"

[var.OIDC__VERIFY_TLS]
text = "Whether the identity provider's certificate is checked. `false` accepts it even when no trusted authority signed it (a company Keycloak whose authority you cannot give in `OIDC__CA_FILE`): whoever can stand between the gateway and the provider can then sign in as anyone, administrators included. The gateway logs a warning at every start. See [Single sign-on with Keycloak](sso-keycloak.md#a-certificate-the-gateway-does-not-trust)."

[var.OIDC__LOGIN_TX_TTL_SECONDS]
text = "How long a sign-in may stay on the identity provider's page (the state, nonce and PKCE cookie)."

[var.MONITORING__NODE_EXPORTER_URL]
text = "node-exporter the RAM badge and the Monitoring panel read the host's memory from, live. Empty = badge off (the chart deploys no node-exporter)."

[var.MONITORING__TIMEOUT_SECONDS]
text = "Timeout of that read."

[var.MONITORING__CACHE_SECONDS]
text = "Seconds one read is shared by every open page."

[var.AUDIT__RETENTION_MINUTES]
text = "Audit entries older than this many minutes are deleted, once a minute. 0 = kept forever. Minutes because on a public demo the useful window is an hour (43200 = thirty days). The privacy notice can quote it."

[var.AUDIT__IP_RETENTION_DAYS]
text = "Client addresses and browser strings are personal data, kept for this many days: past them they are emptied from audit entries, API tokens and sessions, once an hour, and the entry itself stays (who did what, and when). 0 = kept forever. Deleting an account empties its addresses at once, failed sign-ins with its email included. Independent of `AUDIT__RETENTION_MINUTES`: when that one is shorter, entries go before their addresses would."

[var.WEBHOOKS__RETENTION_DAYS]
text = "Days the history of webhook calls is kept."

[var.WEBHOOKS__TIMEOUT_SECONDS]
text = "How long a webhook receiver may take to answer."

[var.OPENLINEAGE__URL]
text = "HTTP endpoint of the collector, e.g. `http://marquez:5000`."

[var.OPENLINEAGE__ENDPOINT]
text = "Path of the lineage endpoint on the collector: `api/v1/lineage` for Marquez and Astro, `openapi/openlineage/api/v1/lineage` for DataHub."

[var.OPENLINEAGE__API_KEY]
text = "Bearer token, if the collector asks for one."

[var.OPENLINEAGE__FILE]
text = "Also, or instead, write the events as JSON Lines to this file."

[var.OPENLINEAGE__NAMESPACE]
text = "Namespace of this installation's jobs."

[var.OPENLINEAGE__TIMEOUT_SECONDS]
text = "How long the collector may take to answer. Events are sent after the run is closed, from a background thread: a collector that is down never fails a run."

[var.OPENLINEAGE_URL]
text = "The OpenLineage library's own variable: switches lineage on like `OPENLINEAGE__URL`, configured the library's way."
section = "gateway-openlineage"

[var.OPENLINEAGE_CONFIG]
text = "The OpenLineage library's own configuration file (`openlineage.yml`), as an alternative to the variables above."
section = "gateway-openlineage"

[var.KUBERNETES__CLUSTER_VIEW]
text = "Turns Administration → Cluster on: the pods of Tabularia and of its users' code, their state, CPU and memory (with metrics-server) and the warning events, read-only, for administrators and observers."
helm = "`clusterView.enabled` (on by default)"

[var.KUBERNETES__SCALING]
text = "Turns the panel's autoscaling bounds on."
