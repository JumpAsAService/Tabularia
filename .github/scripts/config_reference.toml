[var.SCRIPTS__BUILDER_IMAGE]
text = "The image that builds the environments: BuildKit, rootless. Replace it with a mirror on a cluster without internet access."
helm = "`scripts.builderImage`"

[var.SCRIPTS__BASE_IMAGES]
text = "JSON: the language versions offered, and the image each starts from, e.g. `{\"python\": {\"3.12\": \"python:3.12-slim\"}, \"r\": {\"4.5\": \"rocker/r-ver:4.5.3\"}}`. Empty = Python 3.11, 3.12, 3.13, 3.14 (`python:3.x-slim`) and R 4.5, 4.6 (`rocker/r-ver`). Pin them by digest, or point them at a mirror, here."
helm = "`scripts.baseImages`"

[var.SCRIPTS__PYPI_INDEX_URL]
text = "The Python package index the builds install from. Empty = PyPI."
helm = "`scripts.pypiIndexUrl`"

[var.SCRIPTS__CRAN_URL]
text = "The CRAN repository the R builds install from, and the one the scripts' R sees: CRAN itself or one of its mirrors. CRAN publishes sources, so R packages compile during the build; the images carry the system libraries the usual packages need."
helm = "`scripts.cranUrl`"

[var.SCRIPTS__BUILD_TIMEOUT_SECONDS]
text = "The longest an image build may take before it fails."

[var.SCRIPTS__BUILD_CPU]
text = "CPU an environment's image build may use. With SCRIPTS__BUILD_MEMORY it sets how many compilers run at once (one per core at most), which is what makes R packages built from CRAN's sources take minutes or tens of minutes."

[var.SCRIPTS__BUILD_MEMORY]
text = "Memory an environment's image build requests and may use: it lands only on a node that has it. One compiler runs per 1.5 GiB (arrow's C++ takes over 1 GB each); a build that needs more fails alone, saying its compiler was killed. Raise it, with SCRIPTS__BUILD_CPU, to build R environments faster on large nodes."

[var.SCRIPTS__CHECK_TIMEOUT_SECONDS]
text = "The longest the check of a new image may take: pulling it on a node, starting it, listing its packages."

[var.SCRIPTS__POLL_SECONDS]
text = "How often the orchestrators look at the builds in progress, and the longest wait between two looks at a Script node's Job (the first come sooner)."

[var.SCRIPTS__LOG_MAX_BYTES]
text = "How much of the end of a build's log is kept and shown in the panel."

[var.SCRIPTS__JOB_TTL_SECONDS]
text = "Kubernetes removes a finished Job after this long, if Tabularia has not removed it first."

[var.CONTAINERS__ENABLED]
text = "Turns on Administration → Container registries: the registries the images of the Container node come from, on Kubernetes. The Helm chart sets it with `containers.enabled`."

[var.CONTAINERS__NAMESPACE]
text = "Where the flows' runs run the Container nodes, and where each registry's pull Secret is kept. The chart sets it (`containers.namespace`, `<release namespace>-containers` by default), at the `baseline` Pod Security level."

[var.CONTAINERS__TRIAL_NAMESPACE]
text = "Where the editor's «Run» of a Container node and «Try in the cluster» run, with a ResourceQuota of its own. Empty = `CONTAINERS__NAMESPACE`. The chart sets it (`containers.trialNamespace`)."

[var.CONTAINERS__PULL_CHECK_SECONDS]
text = "«Try in the cluster»: how long a node may take to download an image before the check says it did not. The check answers within 270 s (the ingress cuts at 300 s): a longer download is said to be going on, and goes on in the cluster up to this."

[var.CONTAINERS__POLL_SECONDS]
text = "The longest wait between two looks at a Job of the containers' namespaces while the gateway waits for it (the first come sooner)."

[var.CONTAINERS__JOB_TTL_SECONDS]
text = "Kubernetes removes a finished Job of the containers' namespaces after this long, if Tabularia has not removed it first."

[var.CONTAINERS__MAX_CPU]
text = "The most CPU a Container node may ask for (its request and its limit). The chart sets it (`containers.limits.cpu`)."

[var.CONTAINERS__MAX_MEMORY]
text = "The most memory a Container node may ask for (its request and its limit). The chart sets it (`containers.limits.memory`)."

[var.CONTAINERS__MAX_TIMEOUT_SECONDS]
text = "The longest timeout a Container node may have. The chart sets it (`containers.limits.timeoutSeconds`)."

[var.CONTAINERS__LOG_MAX_BYTES]
text = "How much of the end of a container's log the run keeps and the run page shows."

[var.SCRIPTS__LINT]
