[var.SCRIPTS__ENABLED]
text = "Turns the scripting environments on: the admin section and the image builds."
helm = "`scripts.enabled`"

[var.SCRIPTS__NAMESPACE]
text = "Namespace where the scripts and the image checks run (Pod Security level `restricted` is enough)."
helm = "`scripts.namespace`"

[var.SCRIPTS__TRIAL_NAMESPACE]
text = "Namespace where the editor's «Run» of a Script node runs, apart from the flows' runs and with a ResourceQuota of its own, so trials never take resources from scheduled flows. A trial that does not fit in the quota fails at once, saying so. Empty = `SCRIPTS__NAMESPACE`."
