[var.APP__ENGINE_API_THREADS]
text = "Synchronous requests the engine API serves at once. Every open preview holds a thread while it waits for a worker, so this is how many previews can be in flight; they sleep and cost little."

[var.PREVIEW_TIMEOUT_SECONDS]
text = "Longest the engine API waits for a preview worker; then it revokes the job and answers 504. Keep any reverse proxy's read timeout above it."
section = "engine-api"

[var.REDIS__HOST]
text = "Host of the Celery broker and of the step-cache index."

[var.REDIS__PORT]
text = "Its port."

[var.REDIS__DB]
text = "Database number."

[var.REDIS__PASSWORD]
text = "Password, when the broker requires one (managed services usually do)."

[var.STORAGE__ACCESS_KEY]
text = "Access key of the storage."
production = "use credentials of your own (`minioadmin` is the development MinIO's)."

[var.STORAGE__SECRET_KEY]
text = "Secret key of the storage."
production = "use credentials of your own."

[var.STORAGE__BUCKET]
text = "Bucket of every snapshot, cached step and output. The gateway (`ENGINE__BUCKET`) and the frontend (`NUXT_PUBLIC_BUCKET`) need the same name; the Compose file and the chart derive them from this one."

[var.STORAGE__REGION]
text = "Region of the storage (`auto` for Google Cloud Storage)."

[var.STORAGE__DIRECT_READ]
text = "The DuckDB and chDB engines read sources and cached steps in place, only the columns and row groups a query needs. `false`: download each file first, for a service that does not serve range reads."

[var.DUCKDB_EXTENSION_DIRECTORY]
text = "Where DuckDB finds its extensions (`httpfs`, for reading the storage in place). The image sets it to the extensions it ships, so nothing is downloaded at runtime."
