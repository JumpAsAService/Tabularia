helm = "`scripts.buildNamespace`"

[var.SCRIPTS__REGISTRY]
text = "Where the environment images are pushed, as `host[:port]/path`: an environment's image is `<registry>/tabularia-env-<id>:v<n>`. The cluster's nodes pull from it."
helm = "`scripts.registry.repository`"

[var.SCRIPTS__REGISTRY_INSECURE]
text = "The registry speaks plain HTTP or has a self-signed certificate. A test cluster only."
helm = "`scripts.registry.insecure`"

[var.SCRIPTS__REGISTRY_PUSH_SECRET]
text = "Name of a Secret of type `kubernetes.io/dockerconfigjson` in the build namespace, used by the builds to push. Empty = a registry that takes pushes without credentials."
helm = "`scripts.registry.pushSecret`"

[var.SCRIPTS__REGISTRY_PULL_SECRET]
text = "Name of a Secret of type `kubernetes.io/dockerconfigjson` in the scripts namespace, used by the Jobs to pull the images. Empty = the nodes pull without credentials."
helm = "`scripts.registry.pullSecret`"

[var.SCRIPTS__REGISTRY_CA_CONFIGMAP]
