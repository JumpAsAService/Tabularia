[var.CHDB_MAX_BYTES_BEFORE_EXTERNAL_GROUP_BY]
text = "Past this, a chDB GROUP BY spills to disk."
section = "engine-embedded"

[var.CHDB_MAX_BYTES_BEFORE_EXTERNAL_SORT]
text = "Past this, a chDB ORDER BY spills to disk."
section = "engine-embedded"

[var.CHDB_MAX_BYTES_IN_JOIN]
text = "Past this, a chDB join fails instead of growing."
section = "engine-embedded"

[var.ENGINE_MAX_CROSS_JOIN_ROWS]
text = "Rows a cross join may produce in a run before it is refused with a clear error instead of exhausting memory. 0 = no cap."
section = "engine-embedded"

[var.CLICKHOUSE_EXTERNAL__HOST]
text = "Server host. Empty = engine off."

[var.CLICKHOUSE_EXTERNAL__PORT]
text = "HTTP(S) port: 8123 plain, 8443 TLS."

[var.CLICKHOUSE_EXTERNAL__USERNAME]
text = "User the engine works as."

[var.CLICKHOUSE_EXTERNAL__PASSWORD]
text = "Its password."

[var.CLICKHOUSE_EXTERNAL__AI_USERNAME]
text = "A dedicated read-only user for the AI assistant's queries, a second barrier behind the SQL allow-list. Used only when both it and its password are set; otherwise the assistant runs as the user above. Grants: [the AI user](engines/clickhouse-ai-user.md)."

[var.CLICKHOUSE_EXTERNAL__AI_PASSWORD]
text = "Its password."

[var.CLICKHOUSE_EXTERNAL__DATABASE]
text = "Working database; it must exist. In `push` mode it holds the staging tables (the user needs CREATE, INSERT and DROP on it)."

[var.CLICKHOUSE_EXTERNAL__SECURE]
text = "TLS; managed services require it (port 8443)."

[var.CLICKHOUSE_EXTERNAL__CONNECT_TIMEOUT]
text = "Seconds to wait for the handshake."

[var.CLICKHOUSE_EXTERNAL__TRANSPORT]
text = "How the server reaches the data. `s3`: ClickHouse reads and writes the parquet files directly on the storage, nothing passes through the worker (the storage must be reachable from the server). `push`: the worker uploads the source into a staging table and streams the result back; works with any server."
values = "`s3` or `push`"

[var.CLICKHOUSE_EXTERNAL__S3_ENDPOINT]
text = "The storage endpoint as the server sees it (`s3` mode), e.g. `https://s3.fr-par.scw.cloud`. Empty = `STORAGE__ENDPOINT`, right only when the server is on the same network."

[var.CLICKHOUSE_EXTERNAL__S3_NAMED_COLLECTION]
text = "A named collection created on the server with the storage credentials, so the keys never travel in queries nor reach the `query_log`."

[var.CLICKHOUSE_EXTERNAL__MAX_EXECUTION_TIME]
text = "Per-query execution cap in seconds. 0 = none (previews are still bounded by `PREVIEW_TIMEOUT_SECONDS`)."

[var.CLICKHOUSE_EXTERNAL__MATERIALIZE_MIN_ROWS]
text = "`s3` mode: a dataset the viewer reads with more rows than this is copied once into a MergeTree table on the server, 2–6× faster on full scans. 0 = off: the copy is built inside the request and, with large row groups, direct reads are already fast."

[var.CLICKHOUSE_EXTERNAL__MATERIALIZE_DATABASE]
text = "Database of those copies. Empty = the working database."

[var.CLICKHOUSE_EXTERNAL__MATERIALIZE_TTL_SECONDS]
text = "A copy unused for this long is dropped."

[var.CLICKHOUSE_EXTERNAL__PARQUET_SCAN_MAX_THREADS]
text = "On scans (aggregations, pivots, sorts, joins) the engine asks for at least this many threads, to hide the latency of reading from S3; never on LIMIT queries, never below the server's cores. 0 = leave `max_threads` alone."

[var.BIGQUERY__PROJECT]
text = "Google Cloud project the jobs run in. Empty = engine off."

[var.BIGQUERY__CREDENTIALS_FILE]
text = "Path, inside the container, of the service account's JSON key. Either this or `BIGQUERY__CREDENTIALS_B64`."

[var.BIGQUERY__CREDENTIALS_B64]
text = "The same key in base64 on one line (`base64 -w0 key.json`)."

[var.BIGQUERY__LOCATION]
text = "Region of the jobs: the bucket's, or the multi-region containing it (e.g. `EU`). Empty = read from the bucket."

[var.BIGQUERY__MAXIMUM_BYTES_BILLED]
text = "Bytes billed one query may reach: BigQuery refuses a query that would go over before running it (20 GiB ≈ 0.12 $). 0 = no cap."

[var.BIGQUERY__CACHE_DATASET]
text = "Dataset the step cache writes expiring native tables into (created if missing, which needs *BigQuery Data Editor*). Empty = no cache."

[var.INGEST__PARQUET_ROW_GROUP_ROWS]
text = "Rows per parquet row group written by imports. Large groups let the engines read only the columns a query needs; the group is held in memory before it is written (about 570 MB per million rows of a 50-column table), so raise the worker memory with it."

[var.INGEST__DB_READ_TIMEOUT_SECONDS]
text = "How long an import from ClickHouse, or a write into it, waits while the server sends nothing (it may sort a whole table before the first row). Keep it below `CELERY__TASK_SOFT_TIME_LIMIT`, so people read this error and not a killed task."

[var.EXPORT__MAX_ROWS]
text = "Rows of a CSV download from the editor, the viewer or the chat: the browser holds the whole file in memory. Larger results go through an Output node. 0 = no cap."

[var.SHAREPOINT__GRAPH_BASE]
text = "Microsoft Graph endpoint; change it only on a sovereign cloud (US Gov: `https://graph.microsoft.us/v1.0`)."

[var.SHAREPOINT__LOGIN_BASE]
text = "Microsoft sign-in endpoint; likewise (US Gov: `https://login.microsoftonline.us`)."

[var.SFTP__MAX_FILE_BYTES]
text = "Bytes of one file: each one is downloaded to the worker's disk and read in memory to be stacked."

[var.SFTP__MAX_FILES]
text = "Files one refresh may read."

[var.SFTP__MAX_TOTAL_BYTES]
text = "Bytes of all the matching files together."

[var.SFTP__TIMEOUT_SECONDS]
text = "Connection and SSH handshake: a silent server fails within this time."

[var.S3_SOURCE__MAX_FILE_BYTES]
text = "Bytes of one object: downloaded to the worker's disk and read in memory."

[var.S3_SOURCE__MAX_FILES]
text = "Files one refresh may read."

[var.S3_SOURCE__MAX_TOTAL_BYTES]
text = "Bytes of all the matching objects together."

[var.S3_SOURCE__MAX_LISTED]
text = "Keys the globs of one refresh may scan, all their expansions together: `**` on a huge bucket stops here."

[var.S3_SOURCE__MAX_REQUEST_SECONDS]
text = "Wall-clock time of one object's download: a server that drips the bytes stops here."

[var.API__TIMEOUT_SECONDS]
text = "Connection and read timeout of one request, the token request included."

[var.API__MAX_PAGES]
text = "Pages of one call: a pagination that never ends stops here."

[var.API__MAX_CALLS]
text = "Calls of one refresh (the combinations of the list variables)."

[var.API__MAX_ROWS]
text = "Rows one refresh may receive."

[var.API__MAX_RESPONSE_BYTES]
text = "Bytes of one response, decompressed: it is held in memory to be parsed."

[var.API__MAX_TOTAL_BYTES]
text = "Bytes of all the responses of one refresh."

[var.API__MAX_RETRIES]
text = "Retries of a request that failed with 429, 500, 502, 503, 504 or a network error, with exponential backoff or the server's `Retry-After`."

[var.API__MAX_RETRY_WAIT_SECONDS]
text = "A `Retry-After` longer than this fails the refresh instead of holding a worker."

[var.API__MAX_REDIRECTS]
text = "Redirects followed per request."

[var.API__MAX_REQUEST_SECONDS]
text = "Wall-clock time of one request, from sending it to the last byte of the answer."

[var.API__MIN_INTERVAL_SECONDS]
text = "Minimum pause between two requests of one refresh; a datasource can ask for more."

[var.PLACEHOLDERS__MAX_VALUES]
text = "Values of one range variable, and combinations of all the variables of a file datasource; checked when the datasource is saved and at every refresh. An API call is also bounded by `API__MAX_CALLS`."

# ── Frontend ─────────────────────────────────────────────────────────────────

[var.NUXT_PUBLIC_API_BASE]
text = "The gateway's URL as the browser calls it: `/api` when one host serves interface and API, or a full URL on another host."

[var.NUXT_PUBLIC_BUCKET]
text = "Default bucket; must match `STORAGE__BUCKET`."

[var.NUXT_PUBLIC_GRAFANA_URL]
text = "Grafana as the browser reaches it, embedded in the Monitoring tab (administrators only). Optional."

[var.SMTP__VERIFY_TLS]
text = "Verify the SMTP server's certificate and name, with STARTTLS and with implicit TLS (465). `false` is the explicit opt-out for a relay with a self-signed certificate: the connection is still encrypted, but to a server nobody vouched for, and it receives the SMTP password."

[var.UPLOAD__MAX_BYTES]
text = "The largest file a person can upload, in bytes; 0 = no ceiling. The gateway answers 413 before calling the engine when the size is declared, and cuts an undeclared (chunked) body at the ceiling; the engine API refuses it too. The file is spooled on the engine's disk and converted there, so this is also a disk bound: keep the engine's temporary space above it. Imports from SFTP, S3 and APIs have their own caps (`SFTP__*`, `S3_SOURCE__*`, `API__*`)."

# ── Compose and Helm only ────────────────────────────────────────────────────

[var.FORWARDED_ALLOW_IPS]
text = "uvicorn's own variable: the addresses (comma-separated, networks allowed) from which the gateway believes `X-Forwarded-For`. From anyone else the header is ignored and the client is the connection's address, which is what the sign-in throttle, the sessions and the audit log record. Behind your own reverse proxy put its address here; never `*` while the gateway's port is reachable by others, or anyone can choose the address they sign in from. On Kubernetes the chart sets it from `gateway.trustedProxies`."
where = "Compose (`infrastructure/.env`), read by the gateway's server"
default = "`127.0.0.1`"

[var.SAMPLES_SCALE]
text = "Size of the sample data: `small` (seconds, fits a laptop), `medium`, `robusta` (42M order lines, minutes and a few GB). Generated once."

[var.SAMPLES_ENGINE]
text = "Engine of the sample flows. Empty = the first one the policy allows."

[var.SAMPLES_RUN_FLOWS]
text = "Run the sample flows once at initialisation, so their outputs and views exist."

[var.MINIO_IMAGE]
text = "Image of the development MinIO (the official one was withdrawn from the registries)."

[var.WITH_MSSQL]
text = "Build argument: `true` adds Microsoft's SQL Server driver to the backend image you build. Not in the published images, for licensing reasons: see [SQL Server](sqlserver.md)."
where = "Compose (build argument)"

[var.BACKEND_MEM_LIMIT]
text = "Memory ceiling of the engine API container."

[var.WORKER_MEM_LIMIT]
text = "Memory ceiling of the run worker. Keep the sum of the ceilings below the machine's RAM; the per-process cap is derived from it."

[var.PREVIEW_WORKER_MEM_LIMIT]
text = "Memory ceiling of the preview worker."

[var.PREVIEW_WORKER_CONCURRENCY]
text = "Processes of the preview worker (its `CELERY__WORKER_CONCURRENCY`). The per-process memory cap is the ceiling divided by this."

[var.GRAFANA_ADMIN_USER]
text = "Grafana administrator of the development stack."

[var.GRAFANA_ADMIN_PASSWORD]
text = "Its password."
production = "change it wherever Grafana is reachable by others."
default = "development value (hidden)"

[var.TMP_SIZE_LIMIT]
text = "Set by the Helm chart on the workers and the engine: the `sizeLimit` of their `/tmp` (an emptyDir), a Kubernetes quantity (`50Gi`). Past it the kubelet evicts the pod at once, so DuckDB spills at most half of it, shared by the worker's processes, and a query that needs more fails saying so. Unset (Compose): DuckDB's own cap, most of the free disk."
section = "engine-embedded"
where = "Helm (set on the workers and the engine)"

[var.MALLOC_ARENA_MAX]
text = "glibc's variable, set to 2 on the engine containers: one memory arena per thread inflates the resident memory of Polars and Arrow thread pools."
where = "Compose and Helm (set on the engine containers)"
default = "`2`"
