[project]
name = "backend"
version = "1.2.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adbc-driver-manager>=1.4.0",
    "adbc-driver-postgresql>=1.4.0",
    "boto3>=1.43.32",
    "celery>=5.6.3",
    "chdb>=4.2.0",
    "clickhouse-connect>=0.8.0",
    "cryptography>=44.0.0",
    "duckdb>=1.5.0",
    "fastapi>=0.137.1",
    "fastexcel>=0.20.2",
    "google-cloud-bigquery>=3.30.0",
    "google-cloud-bigquery-storage>=2.30.0",
    # the reports' columns (app/reports/frames.py): orders and offsets over whole arrays
    "numpy>=2.0",
    "polars>=1.41.2",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pymysql>=1.1.0",
    # Oracle in Thin mode (pure Python, no Instant Client): fetch_df_batches
    # streams the results as Arrow batches
    "oracledb>=3.4",
    "python-multipart>=0.0.32",
    "redis>=8.0.0",
    "sqlglot>=25.0.0",
    "trino>=0.330.0",
    "uvicorn>=0.49.0",
    "xlsxwriter>=3.2.9",
    # SFTP connections (datasource «SFTP folder» and the SFTP Output): pure Python
    # SSH (LGPL-2.1), with bcrypt and PyNaCl for OpenSSH and ed25519 keys
    "paramiko>=5.0",
    # «API call» datasource: HTTP with redirects followed by hand (credentials never to
    # another host), and JMESPath for odd response shapes. Both were already in the
    # image through boto3 and the Google client; named here because the code uses them.
    "requests>=2.32",
    "jmespath>=1.0",
    # Reports' PDF and on-screen pages: the Typst compiler (Apache-2.0), pinned because
    # the golden PDFs of the tests are byte-identical only with the same compiler
    "typst==0.15.0",
]

[project.optional-dependencies]
# SQL Server: Microsoft's official driver (arrow_reader streams the results as Arrow
# batches). It is NOT in the published images: it depends on mssql-python-odbc,
# Microsoft's ODBC driver under Microsoft's licence, which an AGPL-3.0 image cannot
# redistribute. Whoever needs it installs it and accepts that licence:
# `docker build --build-arg WITH_MSSQL=true`, see docs/sqlserver.md.
sqlserver = [
    "mssql-python>=1.15",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
